      out.push({ d: d, o: o, h: h, l: l, c: c });
    });
    out.sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
    return out;
  }

  /**
   * 取单只标的指定周期的 OHLC K 线。
   * @param sym  内部代码，如 sh600036
   * @param period 'day' | 'week' | 'month'
   * @param count 根数上限（默认 60，够 KDJ 的 K/D 从初值 50 收敛）
   * @param codeOverride 美股必须带交易所后缀（复用 fetchPriceHistory 的口径）
   * @param beg/end 可选起止日期（'YYYY-MM-DD'）。**这两个参数是真的生效的**
   *        —— 实测 `code,day,2015-06-01,2015-12-31,640,` 精确返回该区间的 146 根。
   *        缺省时留空（`code,day,,,60,`），与旧调用完全等价。
   */
  function fetchKlineBars(sym, period, count, codeOverride, beg, end) {
    var varName = 'xjkb_' + (++cbSeq) + '_' + Date.now().toString(36);
    var code = codeOverride ? XJ.market.marketOf(sym) + codeOverride : sym;
    var p = period === 'week' ? 'week' : (period === 'month' ? 'month' : 'day');
    var url = KLINE_URL + code + ',' + p + ',' + (beg || '') + ',' + (end || '') + ',' +
      (count || 60) + ',&_var=' + varName;
    return new Promise(function (resolve) {
      loadScript(url, null, PLAN_TIMEOUT, function () {
        var bars = parseKlineBars(window[varName], code);
        try { delete window[varName]; } catch (e) { window[varName] = undefined; }
        resolve(bars);
      });
    }).catch(function () { return []; });
  }

  /**
   * 批量取「日K + 周K」两套 OHLC。返回 { symbol: { day: [...], week: [...] } }
   * 串行 + 间隔，避免被限流；单只失败不影响其它。
   * 场外基金（of）没有盘中 K 线，直接跳过。
   */
  function fetchKlineBundle(symbols, opts) {
    opts = opts || {};
    var list = (symbols || []).filter(function (s, i, a) {
      return s && a.indexOf(s) === i && XJ.market.assetType(s) !== 'of';
    });
    if (!list.length) return Promise.resolve({});
    var count = opts.count || 60;
    var codes = opts.codes || {};
    var out = {};
    var i = 0;
    function step() {
      if (i >= list.length) return Promise.resolve(out);
      var sym = list[i++];
      return fetchKlineBars(sym, 'day', count, codes[sym]).then(function (day) {
        /* 日K 拿不到就没有任何指标可算，不必再请求周K */
        if (!day || !day.length) return null;
        return fetchKlineBars(sym, 'week', count, codes[sym]).then(function (week) {
          out[sym] = { day: day, week: week || [] };
          return null;
        });
      }).then(function () {
        if (onHistoryTick) onHistoryTick(i, list.length, sym);
        if (i >= list.length) return out;
        return new Promise(function (r) { setTimeout(r, 150); }).then(step);
      });
    }
    return step();
  }

  /**
   * 股息率曲线用的收盘价：**最近十年的日线**（只取收盘价，股息率 = 每股派现 ÷ 收盘价，用不到 OHLC）。
   *
   * ★ 为什么是「分两个窗口」：
   *   腾讯 fqkline 单次 `count` 的**硬上限是 2000 根**（实测 2000 正常、2050 起直接空返回），
   *   而 2000 根日线只有约 8.2 年，撑不满「最近十年」。
   *   好在它的 `beg`/`end` 参数**是生效的**（实测 `code,day,2015-06-01,2015-12-31,640,`
   *   精确返回该区间的 146 根 —— 早先误以为被忽略，是因为拿 11 年的宽区间去测，被 count 截断成了最近 640 根）。
   *   于是拆成「近 8 年」+「再往前 3 年」两次请求再拼接：实测合计 2601 根、跨 3907 天、无重复无缝隙。
   *   两个窗口的边界日可能同时出现在两边，交给 normCloseSeries 按日期去重。
   *
   * 与 klineCache 分开存：那套是完整 OHLC、只留 120 根、给 BOLL/KDJ 用；
   * 把两套量级混在一起会让技术信号白白背上一堆数据。
   */
  var YIELD_SPAN_DAYS = [0, 2920, 4020];   // 今天 / 8 年前 / 11 年前，切成两段
  var YIELD_MAX_BARS = 2700;               // ≈10.7 年日线，再往上裁
  function fetchYieldHistory(symbols, opts) {
    opts = opts || {};
    var list = (symbols || []).filter(function (s, i, a) {
      return s && a.indexOf(s) === i && XJ.market.assetType(s) !== 'of';
    });
    if (!list.length) return Promise.resolve({});
    var codes = opts.codes || {};
    var today = opts.today || U.today();
    var wins = [
      { beg: U.addDays(today, -YIELD_SPAN_DAYS[1]), end: today, count: 2000 },
      { beg: U.addDays(today, -YIELD_SPAN_DAYS[2]), end: U.addDays(today, -YIELD_SPAN_DAYS[1]), count: 900 },
    ];
    var out = {};
    var i = 0;
    function step() {
      if (i >= list.length) return Promise.resolve(out);
      var sym = list[i++];
      var rows = [];
      var w = 0;
      /* 窗口逐个串行取，窗口之间也留间隔，避免被限流 */
      function nextWindow() {
        if (w >= wins.length) return Promise.resolve();
        var win = wins[w++];
        return fetchKlineBars(sym, 'day', win.count, codes[sym], win.beg, win.end).then(function (bars) {
          (bars || []).forEach(function (b) { rows.push([b.d, b.c]); });
          return new Promise(function (r) { setTimeout(r, 120); }).then(nextWindow);
        });
      }
      return nextWindow().then(function () {
        var pts = XJ.model.normCloseSeries(rows);
        if (pts.length > YIELD_MAX_BARS) pts = pts.slice(-YIELD_MAX_BARS);
        if (pts.length >= 2) out[sym] = { day: pts };
        return null;
      }).then(function () {
        if (onHistoryTick) onHistoryTick(i, list.length, sym);
        if (i >= list.length) return out;
        return new Promise(function (r) { setTimeout(r, 150); }).then(step);
      });
    }
    return step();
  }

  /* ---- 余额宝七日年化（对比基准） ----
   * 天天基金 pingzhongdata 里的 Data_sevenDaysYearIncome = [[毫秒时间戳, 七日年化%], ...]，
   * 与场外基金净值走同一条 <script> 注入通道（该域没有 CORS 头，只能靠注入执行 JS 变量）。
   */
  var BENCH_FUND_CODE = '000198';                 // 天弘余额宝
  var BENCH_KEEP_YEARS = 10;

  /**
   * 纯解析：[[毫秒, pct], ...] → [['YYYY-MM-DD', pct], ...]（升序、按周降采样、裁到最近 10 年）
   *
   * 为什么按周：原始是日频（约 4856 点 / 13 年），但七日年化是极平滑的曲线，
   * 日频画在 360px 宽的图上纯属浪费存储与渲染；按周取每周最后一个点即可。
   */
  function parseSevenDay(arr, opts) {
    opts = opts || {};
    if (!arr || !arr.length) return [];
    var byWeek = {};
    for (var i = 0; i < arr.length; i++) {
      var row = arr[i];
      if (!row || row.length < 2) continue;
      var ms = U.num(row[0]), v = U.num(row[1]);
      if (ms === null || v === null || !isFinite(v) || v <= 0) continue;
      var d = new Date(ms);
      if (isNaN(d.getTime())) continue;
      var ymd = d.getFullYear() + '-' + U.pad2(d.getMonth() + 1) + '-' + U.pad2(d.getDate());
      var wk = weekKey(d);
      /* 同周内后出现的点覆盖前面的 → 最终留下每周最后一个点 */
      if (!byWeek[wk] || ymd > byWeek[wk][0]) byWeek[wk] = [ymd, v];
    }
    var out = Object.keys(byWeek).sort().map(function (k) { return byWeek[k]; });
    out.sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });
    var years = U.num(opts.years);
    if (years && years > 0) {
      var today = opts.today || U.today();
      var cutoff = U.addDays(today, -Math.round(years * 365.25));
      out = out.filter(function (r) { return r[0] >= cutoff; });
    }
    return out;
  }

  /** 'YYYY-MM-DD' 的 ISO 周键（周一为起点），用于按周降采样 */
  function weekKey(d) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var dow = (t.getDay() + 6) % 7;               // 周一=0 … 周日=6
    t.setDate(t.getDate() - dow);
    return t.getFullYear() + '-' + U.pad2(t.getMonth() + 1) + '-' + U.pad2(t.getDate());
  }

  function fetchBenchSevenDay() {
    return new Promise(function (resolve) {
      var prev = window.Data_sevenDaysYearIncome;
      var had = Object.prototype.hasOwnProperty.call(window, 'Data_sevenDaysYearIncome');
      loadScript(FUND_NAV_URL + BENCH_FUND_CODE + '.js', 'utf-8', PLAN_TIMEOUT, function () {
        var raw = window.Data_sevenDaysYearIncome;
        var pts = parseSevenDay(raw, { years: BENCH_KEEP_YEARS, today: U.today() });
        /* 还原全局，避免污染其它 pingzhongdata 读取 */
        if (had) window.Data_sevenDaysYearIncome = prev;
        else { try { delete window.Data_sevenDaysYearIncome; } catch (e) { window.Data_sevenDaysYearIncome = undefined; } }
        resolve(pts);
      });
    }).catch(function () { return []; });
  }

  function fetchIndexMinutes(keys) {
    var list = (keys || []).filter(function (k) {
      var d = XJ.market.indexDef(k);
      return d && d.minute;
    });
    if (!list.length) return Promise.resolve({});
    var out = {};
    return Promise.all(list.map(function (key) {
      var def = XJ.market.indexDef(key);
      var varName = 'xjidm_' + (++cbSeq) + '_' + Date.now().toString(36);
      return new Promise(function (resolve) {
        loadScript(MINUTE_URL + def.minute + '&_var=' + varName, null, PLAN_TIMEOUT, function () {
          var m = parseMinute(window[varName], def.minute);
          if (m) out[key] = m;
          try { delete window[varName]; } catch (e) { window[varName] = undefined; }
          resolve();
        });
      });
    })).then(function () { return out; });
  }

  /**
   * A股 → 东财股票分红；港股 → 东财港股 F10；ETF/场外基金 → 天天基金；
   * 美股 → 无公开免费源，归入 unsupported（界面提供手工补录）
   * 返回 { plans: {symbol: DividendPlan[]}, unsupported: symbol[], groups }
   */
  function fetchDividends(symbols, onProgress) {
    symbols = (symbols || []).filter(function (s, i, a) { return s && a.indexOf(s) === i; });
    var groups = { cn: [], hk: [], fund: [], none: [] };
    symbols.forEach(function (s) {
      var src = XJ.market.dividendSource(s) || 'none';
      (groups[src] || groups.none).push(s);
    });

    var out = {};
    var chain = Promise.resolve();

    if (groups.cn.length) {
      chain = chain.then(function () {
        return fetchAllPlans(groups.cn, function (i, t, sym) {
          if (onProgress) onProgress('cn', i, t, sym, 'A股分红方案');
        });
      }).then(function (m) { Object.keys(m).forEach(function (k) { out[k] = m[k]; }); });
    }

    if (groups.hk.length) {
      chain = chain.then(function () {
        return fetchAllHkPlans(groups.hk, function (i, t, sym) {
          if (onProgress) onProgress('hk', i, t, sym, '港股分红方案');
        });
      }).then(function (m) { Object.keys(m).forEach(function (k) { out[k] = m[k]; }); });
    }

    if (groups.fund.length) {
      chain = chain.then(function () {
        var codes = groups.fund.map(function (s) { return XJ.model.codeOf(s); });
        var y = new Date().getFullYear();
        return fetchFundDividends(codes, [y, y - 1, y - 2], function (page, pages, year) {
          if (onProgress) onProgress('fund', page, pages, null, '基金分红 ' + year + ' 年');
        });
      }).then(function (byCode) {
        groups.fund.forEach(function (sym) {
          var rows = byCode[XJ.model.codeOf(sym)] || [];
          out[sym] = rows.map(function (r) { return fundRowToPlan(r, sym); });
        });
      });
    }

    return chain.then(function () {
      return { plans: out, unsupported: groups.none.slice(), groups: groups };
    });
  }

  return {
    fetchQuotes: fetchQuotes,
    fetchFX: fetchFX,
    fetchSymbolSearch: fetchSymbolSearch,
    fetchNames: fetchNames,
    parseHint: parseHint,
    fetchPlans: fetchPlans,
    fetchAllPlans: fetchAllPlans,
    fetchHkPlans: fetchHkPlans,
    fetchAllHkPlans: fetchAllHkPlans,
    fetchCompanyDomains: fetchCompanyDomains,
    fetchMinutes: fetchMinutes,
    parseMinute: parseMinute,
    parseTrends: parseTrends,
    fetchPriceHistory: fetchPriceHistory,
    parseKline: parseKline,
    parseKlineBars: parseKlineBars,
    fetchKlineBars: fetchKlineBars,
    fetchKlineBundle: fetchKlineBundle,
    fetchYieldHistory: fetchYieldHistory,
    fetchLongCloseSeries: fetchLongCloseSeries,
    LONG_MAX_BARS: LONG_MAX_BARS,
    parseSevenDay: parseSevenDay,
    fetchBenchSevenDay: fetchBenchSevenDay,
    parseFundNav: parseFundNav,
    setHistoryProgress: setHistoryProgress,
    fetchIndexHistory: fetchIndexHistory,
    fetchIndexMinutes: fetchIndexMinutes,
    parseIndexKline: parseIndexKline,
    checkLogo: checkLogo,
    verifyLogos: verifyLogos,
    resolveLogo: resolveLogo,
    resolveLogos: resolveLogos,
    LOGO_ALGO: LOGO_ALGO,
    fetchThsLogo: fetchThsLogo,
    parseHkRow: parseHkRow,
    parseHkPerShare: parseHkPerShare,
    hkReportDate: hkReportDate,
    fetchDividends: fetchDividends,
    fetchFundDivPage: fetchFundDivPage,
    fetchFundDivYear: fetchFundDivYear,
    fetchFundDividends: fetchFundDividends,
    parseFundDivRow: parseFundDivRow,
    fundRowToPlan: fundRowToPlan,
    parseQuote: parseQuote,
    cleanName: cleanName,
    parsePlanRow: parsePlanRow,
    mergeByReportDate: mergeByReportDate,
    getLastError: function () { return lastError; },
  };
})();


/* ==================== src/ocr.js ==================== */
/* ==================== 截图识别（智谱 GLM-4V 多模态） ====================
 * 直连智谱开放平台 https://open.bigmodel.cn/api/paas/v4/chat/completions
 *
 * 实测结论（2026-09-10）：
 *   · file:// 页面下 **CORS 放行**（origin=file:// 也能直接 fetch），无需任何后端
 *   · glm-4v-flash（免费）识别持仓数字完全准确，约 5s
 *   · glm-4.1v-thinking-flash（免费）带推理，适合复杂版式，但需关闭思考否则会占满 max_tokens
 *
 * 隐私提示：截图会上传到智谱服务器。界面在首次使用时明确告知。
 */
XJ.ocr = (function () {
  var U = XJ.util;

  var ENDPOINT = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
  var DEFAULT_MODEL = 'glm-4v-flash';

  var MODELS = [
    { key: 'glm-4v-flash', label: 'GLM-4V-Flash', maxTokens: 1024,
      note: '免费 · 快（约 5 秒）· 数字识别准，推荐（上限 1024 tokens）' },
    { key: 'glm-4.1v-thinking-flash', label: 'GLM-4.1V-Thinking-Flash', maxTokens: 2048,
      note: '免费 · 带推理，适合复杂版式（较慢；已自动关闭思考）' },
    { key: 'glm-4v-plus', label: 'GLM-4V-Plus', maxTokens: 2048,
      note: '付费 · 识别率最高' },
  ];

  function maxTokensOf(model) {
    var m = MODELS.filter(function (x) { return x.key === model; })[0];
    return (m && m.maxTokens) || 1024;
  }

  /* 交易记录提示词：与「持仓概览」不同，这张图里没有持仓数量与成本，只有逐笔成交 */
  var TRADE_PROMPT = [
    '这是券商App的「交易记录」/「成交记录」列表截图（通常页头有股票名称与代码）。',
    '请提取**该股票的身份**与**图中所有交易记录**，只输出一个 JSON 对象，不要解释文字，不要 Markdown 代码块。',
    '格式：',
    '{"name":"股票名称","code":"股票代码","trades":[{"date":"2026-08-28","action":"买入","price":16.950,"quantity":200,"amount":3390.00,"fee":0.38}]}',
    '规则：',
    '1. date 统一为 YYYY-MM-DD；图中只有 08-28 这类省略年份的写法时，补上当前年份',
    '2. action 归一化为三种：买入 / 卖出 / 分红（原图可能写「证券买入」「买」「卖」「股息入账」「利息归本」等）',
    '3. price / quantity / amount / fee 必须原样保留小数点，去掉 ¥ 与千分位逗号；图中没有的字段填 null',
    '3b. **数量与金额一律填正数**：券商流水里卖出的负号（如 -200 股 / -3390.00 元）只是方向标记，',
    '    请去掉负号，方向完全由 action 字段表达。这一条非常重要，漏掉会导致卖出记录丢失。',
    '4. 「分红」「股息」「利息」这类行 action 填「分红」，amount 填到账金额，price 与 quantity 填 null',
    '5. 「送股」「转增」「红股」按 action「买入」且 price 填 0',
    '6. **买入与卖出都必须提取，一条都不能漏**；也不要把「浮动盈亏」「当日参考盈亏」「持仓天数」「个股仓位」「分红收益」这类汇总数字当成交易',
    '7. 第一个字符必须是 {',
  ].join('\n');

  var CLASSIFY_PROMPT = [
    '这张券商App截图属于哪种？只回答一个词，不要输出任何其它内容：',
    '如果是「多条买卖交易记录列表」（每条记录含价格 / 数量 / 金额），回答 TRADE',
    '如果是「持仓列表」或「个股持仓概览」（含持仓数量与成本），回答 HOLDING',
  ].join('\n');

  /* 提示词经过实测调优：
     · 必须显式要求「保留小数点」，否则 glm-4v-flash 会把 23.9950 读成 239950
     · 必须显式列出字段的中文标签，否则容易把「市值/浮动盈亏」误当作成本或数量 */
  var PROMPT = [
    '这是券商App的持仓列表或个股详情截图，请提取图中所有股票持仓。',
    '只输出一个 JSON 数组，不要解释文字，不要 Markdown 代码块，第一个字符必须是 [ 。',
    '元素格式：{"name":"名称","code":"代码","quantity":持股数,"cost":成本价,"price":现价}',
    '数值规则（重要）：',
    '- 必须原样保留小数点。图中写 23.9950 就输出 23.9950，写 23.89 就输出 23.89',
    '- 只可去掉货币符号(¥ $)与千分位逗号，绝对不要去掉小数点',
    '- 识别不到就填 null，不要猜测或编造',
    '字段规则：',
    '- name 与 code 通常在页面标题栏或列表行首；code 为纯代码：A股/ETF 6 位数字，港股 5 位数字，美股字母如 AAPL',
    '- quantity 是持股数量（不是可用数量、不是市值）',
    '- cost 是每股成本（标签通常是「成本」「摊薄成本」「持仓成本」）',
    '- price 是当前每股价格（标签通常是「现价」「最新价」「收盘价」）',
    '- 若截图只有一只股票，也返回只含一个元素的数组',
  ].join('\n');

  /* ---------------- 图片预处理：等比缩到 1280 宽并转 JPEG，减小请求体 ---------------- */
  function fileToDataUrl(file, maxW) {
    maxW = maxW || 1280;
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error('文件读取失败')); };
      fr.onload = function () {
        var raw = String(fr.result);
        var img = new Image();
        img.onerror = function () {
          // 极端情况下（如 HEIC）直接回退原图，交给模型处理
          resolve(raw);
        };
        img.onload = function () {
          try {
            var scale = Math.min(1, maxW / (img.width || maxW));
            var w = Math.max(1, Math.round((img.width || maxW) * scale));
            var h = Math.max(1, Math.round((img.height || maxW) * scale));
            var cv = document.createElement('canvas');
            cv.width = w; cv.height = h;
            var ctx = cv.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            resolve(cv.toDataURL('image/jpeg', 0.9));
          } catch (e) {
            resolve(raw);
          }
        };
        img.src = raw;
      };
      fr.readAsDataURL(file);
    });
  }

  /* ---------------- 从模型输出里稳健地抠出 JSON ---------------- */
  function extractJson(text) {
    var s = String(text || '');
    s = s.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();   // 去思考过程
    s = s.replace(/<\|[^|]*\|>/g, '').trim();
    s = s.replace(/^```(?:json)?/i, '').replace(/```\s*$/, '').trim();

    var a = s.indexOf('['), b = s.lastIndexOf(']');
    if (a >= 0 && b > a) {
      s = s.slice(a, b + 1);
    } else {
      var oa = s.indexOf('{'), ob = s.lastIndexOf('}');
      if (oa < 0 || ob <= oa) throw new Error('模型未返回可解析的 JSON：' + s.slice(0, 140));
      s = '[' + s.slice(oa, ob + 1) + ']';
    }

    var arr;
    try {
      arr = JSON.parse(s);
    } catch (e1) {
      try {
        arr = JSON.parse(s.replace(/,\s*([\]}])/g, '$1').replace(/([{,]\s*)([A-Za-z_\u4e00-\u9fa5]+)\s*:/g, '$1"$2":'));
      } catch (e2) {
        throw new Error('JSON 解析失败：' + s.slice(0, 140));
      }
    }
    if (!Array.isArray(arr)) arr = [arr];

    var out = [];
    arr.forEach(function (r) {
      var n = normalizeRow(r);
      if (!n) return;
      // 只要有任何一项可用信息就保留：模型读不到名称/代码时，用户可以在「核对」里补
      var meaningful = n.code || n.name ||
        (n.quantity !== null && (n.cost !== null || n.price !== null));
      if (meaningful) out.push(n);
    });
    return out;
  }

  function toNum(v) {
    if (v === null || v === undefined || v === '') return null;
    var n = parseFloat(String(v).replace(/[^\d.\-]/g, ''));
    return isNaN(n) ? null : n;
  }

  function pick(r, keys) {
    for (var i = 0; i < keys.length; i++) {
      if (r[keys[i]] !== undefined && r[keys[i]] !== null && r[keys[i]] !== '') return r[keys[i]];
    }
    return null;
  }

  /** 兼容模型返回中文键名或英文字段 */
  function normalizeRow(r) {
    if (!r || typeof r !== 'object') return null;
    var name = String(pick(r, ['name', '股票名称', '名称', 'stock_name']) || '').trim();
    var codeRaw = String(pick(r, ['code', '股票代码', '代码', 'symbol', 'ticker']) || '').trim();
    var code = codeRaw.replace(/[^0-9A-Za-z]/g, '') || null;
    return {
      name: name,
      code: code,
      quantity: toNum(pick(r, ['quantity', '持仓数量', '数量', '持股数量', '股数', 'shares'])),
      cost: toNum(pick(r, ['cost', '成本价', '成本', '持仓成本', '摊薄成本'])),
      price: toNum(pick(r, ['price', '现价', '当前价', '市价', '最新价'])),
    };
  }

  /* ---------------- 调用模型（返回原始文本） ---------------- */
  function callModel(dataUrl, opts) {
    opts = opts || {};
    var key = opts.apiKey;
    if (!key) return Promise.reject(new Error('未配置智谱 API Key'));

    var model = opts.model || DEFAULT_MODEL;
    var body = {
      model: model,
      temperature: opts.temperature === undefined ? 0.05 : opts.temperature,
      max_tokens: opts.maxTokens || maxTokensOf(model),
      messages: [{
        role: 'user',
        content: [
          { type: 'image_url', image_url: { url: dataUrl } },
          { type: 'text', text: opts.prompt || PROMPT },
        ],
      }],
    };
    if (/thinking/i.test(model)) body.thinking = { type: 'disabled' };

    return fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify(body),
    }).then(function (r) {
      return r.text().then(function (t) {
        var j = null;
        try { j = JSON.parse(t); } catch (e) { /* 下面统一报错 */ }
        if (!j) throw new Error('接口返回非 JSON（HTTP ' + r.status + '）：' + t.slice(0, 120));
        if (!r.ok) {
          var msg = (j.error && (j.error.message || j.error.code)) || j.message || ('HTTP ' + r.status);
          if (r.status === 401 || /invalid.*api.*key|认证失败/i.test(String(msg))) {
            throw new Error('API Key 无效或已过期，请在「我的 · 截图识别设置」中更新');
          }
          throw new Error('识别失败：' + msg);
        }
        var c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if (!c) throw new Error('模型没有返回内容');
        return { content: c, usage: j.usage || null };
      });
    }).catch(function (e) {
      if (e && e.name === 'TypeError') throw new Error('网络请求失败（可能是断网或浏览器拦截了跨域请求）');
      throw e;
    });
  }

  /* ---------------- 识别持仓概览 ---------------- */
  function recognize(dataUrl, opts) {
    return callModel(dataUrl, opts).then(function (res) {
      var rows = extractJson(res.content);
      rows.usage = res.usage;
      return rows;
    });
  }

  /* ---------------- 识别交易记录 ---------------- */
  /* 顺序即优先级：先判卖出，再判买入（含送股/转增/红股），最后才判分红。
     注意不要把「入账」当成分红特征 —— 「红股入账」是送股（买入，价格 0）。 */
  var ACT_MAP = [
    [/卖出|SELL|减仓|赎回/i, 'SELL'],
    [/红股|送股|转增|买入|BUY|建仓|加仓|申购|^买/i, 'BUY'],
    [/分红|股息|红利|派息|利息|DIV/i, 'DIV'],
  ];
  function normAction(a) {
    var s = String(a || '');
    for (var i = 0; i < ACT_MAP.length; i++) if (ACT_MAP[i][0].test(s)) return ACT_MAP[i][1];
    return 'BUY';
  }
  function normDate(d, fallbackYear) {
    var s = String(d || '').trim();
    if (!s) return null;
    s = s.replace(/[年月]/g, '-').replace(/日/g, '').replace(/[./]/g, '-').replace(/-+$/, '');
    var m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return m[1] + '-' + String(+m[2]).padStart(2, '0') + '-' + String(+m[3]).padStart(2, '0');
    m = s.match(/^(\d{1,2})-(\d{1,2})$/);
    if (m) return (fallbackYear || new Date().getFullYear()) + '-' +
      String(+m[1]).padStart(2, '0') + '-' + String(+m[2]).padStart(2, '0');
    return null;
  }
  function normalizeTradeRow(r, year) {
    if (!r || typeof r !== 'object') return null;
    var action = normAction(pick(r, ['action', 'direction', 'type', '方向', '操作', '业务名称', '摘要']));
    var date = normDate(pick(r, ['date', '日期', '成交日期', '发生日期', '交易日期']), year);
    var priceRaw = toNum(pick(r, ['price', '价格', '成交价格', '成交均价', '均价']));
    var qtyRaw = toNum(pick(r, ['quantity', '数量', '成交数量', '股数']));
    var amtRaw = toNum(pick(r, ['amount', '金额', '成交金额', '发生金额']));
    var feeRaw = toNum(pick(r, ['fee', '费用', '手续费', '佣金', '交易税费']));

    /* 券商流水常把卖出写成负数（数量 -200 / 金额 -3390）。
       ① 负号只表示方向 → 一律取绝对值存数量与金额
       ② 若模型把方向读成了「买入」但数值为负，按负数纠正为卖出 */
    var neg = (qtyRaw !== null && qtyRaw < 0) || (amtRaw !== null && amtRaw < 0);
    if (neg && action === 'BUY') action = 'SELL';

    var price = priceRaw === null ? null : Math.abs(priceRaw);
    var quantity = qtyRaw === null ? null : Math.abs(qtyRaw);
    var amount = amtRaw === null ? null : Math.abs(amtRaw);
    var fee = feeRaw === null ? null : Math.abs(feeRaw);

    if (!date && price === null && quantity === null && amount === null) return null;
    if (action === 'DIV') { price = null; quantity = null; }
    return { date: date, action: action, price: price, quantity: quantity, amount: amount, fee: fee };
  }

  function cleanText(text) {
    var s = String(text || '');
    s = s.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
    s = s.replace(/<\|[^|]*\|>/g, '').trim();
    return s.replace(/^```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  }

  function extractTradeJson(text) {
    var s = cleanText(text);
    var year = new Date().getFullYear();
    var obj = null;
    var oa = s.indexOf('{'), ob = s.lastIndexOf('}');
    if (oa >= 0 && ob > oa) {
      try { obj = JSON.parse(s.slice(oa, ob + 1)); } catch (e1) { obj = null; }
    }
    var arr = [], name = '', code = '';
    if (obj && (obj.trades || obj.records || obj.list || obj.items)) {
      name = String(obj.name || obj['名称'] || obj.stockName || obj['股票名称'] || '').trim();
      code = String(obj.code || obj['代码'] || obj.stockCode || obj['股票代码'] || '').replace(/[^0-9A-Za-z]/g, '');
      arr = obj.trades || obj.records || obj.list || obj.items;
    } else {
      var a = s.indexOf('['), b = s.lastIndexOf(']');
      if (a < 0 || b <= a) throw new Error('模型未返回可解析的 JSON：' + s.slice(0, 140));
      try { arr = JSON.parse(s.slice(a, b + 1)); } catch (e2) {
        throw new Error('JSON 解析失败：' + s.slice(0, 140));
      }
    }
    if (!Array.isArray(arr)) arr = [arr];
    var rows = [];
    arr.forEach(function (r) { var n = normalizeTradeRow(r, year); if (n) rows.push(n); });
    return {
      name: name, code: code, trades: rows,
      symbol: code ? (XJ.market.normalize(code) || null) : null,
    };
  }

  function recognizeTrades(dataUrl, opts) {
    return callModel(dataUrl, Object.assign({}, opts, { prompt: TRADE_PROMPT })).then(function (res) {
      var out = extractTradeJson(res.content);
      out.usage = res.usage;
      return out;
    });
  }

  /* ---------------- 截图类型判断（一次轻量调用） ---------------- */
  function classify(dataUrl, opts) {
    opts = opts || {};
    if (!opts.apiKey) return Promise.resolve('holding');
    return callModel(dataUrl, {
      apiKey: opts.apiKey, model: opts.model,
      prompt: CLASSIFY_PROMPT, temperature: 0, maxTokens: 8,
    }).then(function (res) {
      return /TRADE/i.test(res.content) ? 'trade' : 'holding';
    }).catch(function () { return 'holding'; });
  }

  /**
   * 自动识别：先判断截图类型，再用对应提示词识别。
   *   holding → 输出持仓行数组（带 model / score 附加属性）
   *   trade   → 输出 { name, code, symbol, trades:[] }
   * 结果质量不足时自动换用更强的模型重试一次。
   */
  function recognizeAuto(dataUrl, opts) {
    opts = opts || {};
    var forced = opts.kind;                       // 'holding' | 'trade' | undefined(自动)
    return (forced ? Promise.resolve(forced) : classify(dataUrl, opts)).then(function (kind) {
      var run = function (model) {
        return kind === 'trade'
          ? recognizeTrades(dataUrl, { apiKey: opts.apiKey, model: model })
          : recognize(dataUrl, { apiKey: opts.apiKey, model: model });
      };
      var score = function (res) {
        return kind === 'trade' ? scoreTrades(res.trades) : scoreRows(res);
      };
      return run(opts.model || DEFAULT_MODEL).then(function (res) {
        if (score(res) >= GOOD_ENOUGH || !opts.apiKey || (opts.model || DEFAULT_MODEL) === FALLBACK_MODEL) {
          res.kind = kind; res.model = opts.model || DEFAULT_MODEL; res.retried = false;
          return res;
        }
        return run(FALLBACK_MODEL).then(function (res2) {
          var best = score(res2) > score(res) ? res2 : res;
          best.kind = kind; best.model = best === res2 ? FALLBACK_MODEL : (opts.model || DEFAULT_MODEL);
          best.retried = true;
          return best;
        }).catch(function () {
          res.kind = kind; res.model = opts.model || DEFAULT_MODEL; res.retried = false;
          return res;
        });
      }).catch(function (e) {
        e.kind = kind;
        throw e;
      });
    });
  }

  /** 交易记录的完整度：date / action / (price|amount) / quantity（分红行不要 quantity） */
  function scoreTrades(trades) {
    if (!trades || !trades.length) return 0;
    var total = 0, filled = 0;
    trades.forEach(function (t) {
      total += 4;
      if (t.date) filled++;
      if (t.action) filled++;
      if (t.price !== null || t.amount !== null) filled++;
      if (t.action === 'DIV' || (t.quantity !== null && t.quantity > 0)) filled++;
    });
    return total ? filled / total : 0;
  }

  /**
   * 双模型兜底：先用主模型（快、免费）识别；若关键字段完整度不足，
   * 自动用更强的模型重试一次，取两者中更完整的那份结果。
   * 解决"识别出了名称与代码，但数量与成本全缺失"这类漏读。
   */
  var FALLBACK_MODEL = 'glm-4.1v-thinking-flash';
  var GOOD_ENOUGH = 0.85;

  /** 关键字段完整度（0~1）：code / quantity / cost 三项 */
  function scoreRows(rows) {
    if (!rows || !rows.length) return 0;
    var total = 0, filled = 0;
    rows.forEach(function (r) {
      total += 3;
      if (r.code) filled++;
      if (r.quantity !== null && r.quantity > 0) filled++;
      if (r.cost !== null) filled++;
    });
    return total ? filled / total : 0;
  }

  function recognizeWithFallback(dataUrl, opts) {
    opts = opts || {};
    var primary = opts.model || DEFAULT_MODEL;
    var fallback = opts.fallbackModel || FALLBACK_MODEL;
    var tried = [];

    function attempt(model) {
      return recognize(dataUrl, { apiKey: opts.apiKey, model: model, prompt: opts.prompt })
        .then(function (rows) {
          tried.push({ model: model, rows: rows, score: scoreRows(rows) });
          return rows;
        });
    }

    return attempt(primary).then(function (first) {
      var s1 = scoreRows(first);
      if (s1 >= GOOD_ENOUGH || !opts.apiKey || primary === fallback) {
        if (first && first.length) { first.model = primary; first.score = s1; }
        return first;
      }
      return attempt(fallback).then(function () {
        var best = tried.slice().sort(function (a, b) { return b.score - a.score; })[0];
        var rows = (best && best.rows && best.rows.length) ? best.rows : first;
        if (rows) { rows.model = best ? best.model : primary; rows.score = best ? best.score : s1; rows.retried = true; }
        return rows;
      }).catch(function () {
        if (first) { first.model = primary; first.score = s1; }
        return first;
      });
    });
  }

  /**
   * 解析最终要写入的 symbol。
   * **输入框优先** —— 它是用户屏幕上看到的真源；只有输入框为空时才回退到草稿里的值。
   * （历史 bug：草稿优先导致用户手改代码不生效，中远海控被写成了保利发展）
   */
  function resolveSymbol(typedCode, draftSymbol) {
    var code = String(typedCode || '').replace(/[^0-9A-Za-z]/g, '');
    if (code) return XJ.market.normalize(code) || null;
    return draftSymbol || null;
  }

  /**
   * 多张截图分批识别时，判断新结果是否换了另一只股票。
   * 换了股票但新图没给出代码 → 旧的代码必须作废，否则会张冠李戴。
   */
  function mergeTradeIdentity(cur, res) {
    var next = { name: cur.name || '', symbol: cur.symbol || null };
    var nameChanged = !!(res.name && cur.name && res.name !== cur.name);
    if (res.symbol) next.symbol = res.symbol;
    else if (nameChanged) next.symbol = null;
    if (res.name) next.name = res.name;
    return next;
  }

  return {
    ENDPOINT: ENDPOINT,
    resolveSymbol: resolveSymbol,
    mergeTradeIdentity: mergeTradeIdentity,
    DEFAULT_MODEL: DEFAULT_MODEL,
    FALLBACK_MODEL: FALLBACK_MODEL,
    GOOD_ENOUGH: GOOD_ENOUGH,
    scoreRows: scoreRows,
    scoreTrades: scoreTrades,
    recognizeWithFallback: recognizeWithFallback,
    recognizeAuto: recognizeAuto,
    recognizeTrades: recognizeTrades,
    extractTradeJson: extractTradeJson,
    normalizeTradeRow: normalizeTradeRow,
    normAction: normAction,
    normDate: normDate,
    classify: classify,
    callModel: callModel,
    TRADE_PROMPT: TRADE_PROMPT,
    CLASSIFY_PROMPT: CLASSIFY_PROMPT,
    MODELS: MODELS,
    maxTokensOf: maxTokensOf,
    PROMPT: PROMPT,
    fileToDataUrl: fileToDataUrl,
    extractJson: extractJson,
    normalizeRow: normalizeRow,
    recognize: recognize,
  };
})();


/* ==================== src/chart.js ==================== */
/* ==================== 资产变动曲线（参照同花顺） ====================
 * 零依赖内联 SVG。特性：
 *   · 纵轴金额刻度（自动取整）+ 横向网格线
 *   · 横轴日期刻度（首 / 中 / 末）
 *   · 面积渐变 + 涨红跌绿描边
 *   · 按下并拖动查看任意一天的数值（十字虚线 + 高亮点 + 气泡）
 * 固定内部坐标系 360×220，配 width:100%;height:auto —— 各端等比缩放，文字不变形。
 */
XJ.chart = (function () {
  var U = XJ.util;

  var W = 360, H = 220;
  var PL = 6, PR = 46, PT = 16, PB = 26;      // 左/右/上/下内边距（右侧留给纵轴标签）

  /** 把区间切成 3~5 个"整齐"的刻度（1/2/5 × 10^n 步长） */
  function niceScale(min, max, count) {
    count = count || 4;
    if (!isFinite(min) || !isFinite(max)) return { lo: 0, hi: 1, ticks: [0, 1] };
    if (max === min) { min -= 1; max += 1; }
    var range = max - min;
    var rough = range / count;
    var mag = Math.pow(10, Math.floor(Math.log(rough) / Math.LN10));
    var norm = rough / mag;
    var step = mag * (norm >= 7.5 ? 10 : norm >= 3.5 ? 5 : norm >= 1.5 ? 2 : 1);
    var lo = Math.floor(min / step) * step;
    var hi = Math.ceil(max / step) * step;
    var ticks = [];
    for (var v = lo; v <= hi + step * 1e-6; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
    return { lo: lo, hi: hi, ticks: ticks };
  }

  function shortDate(d) { return String(d || '').slice(5).replace('-', '/'); }
  function ymdShort(d) {
    var s = String(d || '');
    return s.length >= 10 ? s.slice(2, 4) + '/' + s.slice(5, 7) + '/' + s.slice(8, 10) : s;
  }

  function esc(s) { return U.esc(String(s === null || s === undefined ? '' : s)); }

  var gradSeq = 0;

  /** 两个 'YYYY-MM-DD' 相差几天（用于散点吸附的距离闸门）；无法解析时返回 Infinity */
  function dayGap(a, b) {
    var g = U.daysBetween(a, b);
    return g === null ? Infinity : Math.abs(g);
  }

  /** 在有序日期数组里找与 d 最接近的下标（二分，找不到返回 -1） */
  function nearestDateIndex(dates, d) {
    var n = dates.length;
    if (!n) return -1;
    if (d <= dates[0]) return 0;
    if (d >= dates[n - 1]) return n - 1;
    var lo = 0, hi = n - 1;
    while (hi - lo > 1) {
      var mid = (lo + hi) >> 1;
      if (dates[mid] <= d) lo = mid; else hi = mid;
    }
    /* 谁离得近取谁 —— 必须按「天数」比，直接相减是字符串运算会得到 NaN */
    return dayGap(dates[lo], d) <= dayGap(dates[hi], d) ? lo : hi;
  }

  /* 散点吸附的最大容忍天数：超过就不画，避免把十年外的日期吸到曲线最左端 */
  var MARK_SNAP_DAYS = 7;

  /**
   * @param series [{ date:'YYYY-MM-DD', mv:number }] 按日期升序，至少 2 点
   * @param opts   { fmtY, xFormat:'short'|'ymd', xTicks, label }
   */
  function render(series, opts) {
    opts = opts || {};
    if (!series || series.length < 2) return '';

    var vals = series.map(function (p) { return p.mv; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var sc = niceScale(min, max, 4);
    var span = (sc.hi - sc.lo) || 1;
    var fmtY = opts.fmtY || U.moneyCompact;

    var x0 = PL, x1 = W - PR, y0 = PT, y1 = H - PB;
    var n = series.length;
    function px(i) { return n > 1 ? x0 + (x1 - x0) * (i / (n - 1)) : (x0 + x1) / 2; }
    function py(v) { return y1 - (v - sc.lo) / span * (y1 - y0); }

    var line = series.map(function (p, i) {
      return (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(p.mv).toFixed(1);
    }).join('');
    var area = line + ' L' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' L' + x0.toFixed(1) + ' ' + y1.toFixed(1) + ' Z';

    var up = vals[n - 1] >= vals[0];
    var color = opts.color || (up ? '#E0312F' : '#12A150');
    /* 渐变 id 必须每次唯一：一页可能有不止一张图，重复 id 会让后一张取到前一张的渐变 */
    var gid = 'xjcGrad' + (++gradSeq);

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="xj-chart" data-chart="' +
      esc(opts.chartKey || 'asset') + '"' +
      ' data-n="' + n + '" data-x0="' + x0 + '" data-x1="' + x1 + '"' +
      ' data-y0="' + y0 + '" data-y1="' + y1 + '" data-lo="' + sc.lo + '" data-hi="' + sc.hi + '"' +
      ' data-series="' + esc(JSON.stringify(series.map(function (p) { return { d: p.date, v: p.mv }; }))) + '">';

    svg += '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.24"/>' +
      '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>';

    /* 网格线 + 纵轴金额刻度 */
    sc.ticks.forEach(function (t) {
      var y = py(t);
      if (y < y0 - 1.5 || y > y1 + 1.5) return;
      svg += '<line x1="' + x0 + '" y1="' + y.toFixed(1) + '" x2="' + x1 + '" y2="' + y.toFixed(1) +
        '" style="stroke:var(--line)" stroke-width="1" stroke-dasharray="3 4"/>';
      svg += '<text x="' + (x1 + 5) + '" y="' + (y + 3.5).toFixed(1) + '" font-size="10" style="fill:var(--text-3)">' +
        esc(fmtY(t)) + '</text>';
    });

    svg += '<path d="' + area + '" fill="url(#' + gid + ')"/>';
    svg += '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2" ' +
      'stroke-linejoin="round" stroke-linecap="round"/>';

    /* 横轴日期刻度：默认首/中/末三点，图 6 风格用 5 点 + yy/mm/dd */
    var want = opts.xTicks || (n >= 4 ? 3 : 2);
    var idxs = [];
    for (var k = 0; k < want; k++) {
      idxs.push(Math.round(k * (n - 1) / (want - 1)));
    }
    var seen = {};
    idxs = idxs.filter(function (i) { if (seen[i]) return false; seen[i] = 1; return true; });
    var fmtX = opts.xFormat === 'ymd' ? ymdShort : shortDate;
    idxs.forEach(function (i) {
      var anchor = (i === 0) ? 'start' : (i === n - 1) ? 'end' : 'middle';
      svg += '<text x="' + px(i).toFixed(1) + '" y="' + (y1 + 16) + '" font-size="10" ' +
        'style="fill:var(--text-3)" text-anchor="' + anchor + '">' + esc(fmtX(series[i].date)) + '</text>';
    });

    /* 标记组（拖动时显示） */
    svg += '<g class="xjc-marker" style="display:none">' +
      '<line class="xjc-vline" y1="' + y0 + '" y2="' + y1 + '" style="stroke:var(--text-2)" stroke-width="1" stroke-dasharray="3 3"/>' +
      '<circle class="xjc-dot" r="4.5" fill="#fff" stroke="' + color + '" stroke-width="2.5"/>' +
      '<g class="xjc-bub">' +
      '<rect rx="7" width="94" height="33" fill="rgba(28,28,30,0.92)"/>' +
      '<text class="xjc-bub-v" x="47" y="14.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle"></text>' +
      '<text class="xjc-bub-d" x="47" y="26.5" font-size="9" fill="rgba(255,255,255,0.72)" text-anchor="middle"></text>' +
      '</g></g>';

    svg += '</svg>';
    return svg;
  }

  /* ---------------- 多序列对比图（收益率 + 指数） ----------------
   * seriesList: [{ key, name, color, points:[{date, pct}], candles?:[{date,o,h,l,c}] }]
   * opts: { xTicks, height, mode:'line'|'candle', unit:'%'|'¥' }
   *
   * 与单序列图的区别：
   *   · 多条曲线各自配色（图例与曲线同色）
   *   · 拖动时显示**竖向高亮带** + 一次性列出所有曲线在该日的读数
   *   · 支持蜡烛图（指数的 OHLC 已换算成相对起点的收益率）
   */
  var CW = 360, CH = 196;
  var CPL = 8, CPR = 46, CPT = 14, CPB = 24;

  function renderCompare(seriesList, opts) {
    opts = opts || {};
    seriesList = (seriesList || []).filter(function (s) { return s && s.points && s.points.length; });
    if (!seriesList.length) return '';

    /* 横轴用所有曲线日期的并集（不同市场交易日不同） */
    var dateSet = {};
    seriesList.forEach(function (s) { s.points.forEach(function (p) { dateSet[p.date] = true; }); });
    if (opts.candles) opts.candles.forEach(function (c) { dateSet[c.date] = true; });
    /* 注意：散点的日期【不】并入 —— 它们会被吸附到第一条曲线已有的点上（见下），
       若并进来就等于给它们各开了一格，既毁掉吸附、又让横轴出现非均匀的时间步长。 */
    var dates = Object.keys(dateSet).sort();
    if (dates.length < 2) return '';
    var di = {};
    dates.forEach(function (d, i) { di[d] = i; });

    /* 纵轴范围：所有曲线的百分比 + 蜡烛的高低点都算进去 */
    var vals = [];
    seriesList.forEach(function (s) { s.points.forEach(function (p) { vals.push(U.n0(p.pct)); }); });
    if (opts.candles) {
      opts.candles.forEach(function (c) { vals.push(U.n0(c.l), U.n0(c.h)); });
    }
    if (!vals.length) return '';
    var sc = niceScale(Math.min.apply(null, vals), Math.max.apply(null, vals), 4);
    var span = (sc.hi - sc.lo) || 1;
    var fmtY = opts.fmtY || U.pctAxis;

    var x0 = CPL, x1 = CW - CPR, y0 = CPT, y1 = CH - CPB;
    var n = dates.length;
    function px(i) { return n > 1 ? x0 + (x1 - x0) * (i / (n - 1)) : (x0 + x1) / 2; }
    function py(v) { return y1 - (v - sc.lo) / span * (y1 - y0); }

    var gid = 'xjCmp' + (++gradSeq);
    var svg = '<svg viewBox="0 0 ' + CW + ' ' + CH + '" class="xj-chart xj-cmp" data-chart="' +
      esc(opts.chartKey || 'cmp') + '"' +
      ' data-n="' + n + '" data-x0="' + x0 + '" data-x1="' + x1 + '"' +
      ' data-y0="' + y0 + '" data-y1="' + y1 + '" data-lo="' + sc.lo + '" data-hi="' + sc.hi + '"' +
      ' data-cmp="' + esc(JSON.stringify({
        dates: dates,
        unit: opts.unit || '%',
        rows: seriesList.map(function (s) {
          var arr = new Array(n);
          s.points.forEach(function (p) { arr[di[p.date]] = p.pct; });
          /* ★ 前值填充 + 前向回填。
             横轴是各曲线日期的**并集**（不同市场交易日不同；余额宝基准更是周频），
             所以某条曲线在别的曲线的日期上一定有点是空的。
             不填的话拖动读数就是「—」——而曲线明明画着（折线在两点间隐含了前值），
             看起来就像「这一天没有股息率」，实际只是那天没有观测点。
             开头那一段没有更早的值可继承，用第一个已知值回填，保证任何一天都有读数。 */
          var last = null, q;
          for (q = 0; q < n; q++) {
            if (arr[q] !== undefined && arr[q] !== null) last = arr[q];
            else if (last !== null) arr[q] = last;
          }
          last = null;
          for (q = n - 1; q >= 0; q--) {
            if (arr[q] !== undefined && arr[q] !== null) last = arr[q];
            else if (last !== null) arr[q] = last;
          }
          return { name: s.name, color: s.color, vals: arr };
        }),
      })) + '">';

    svg += '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + (seriesList[0].color || '#E8461F') + '" stop-opacity="0.16"/>' +
      '<stop offset="100%" stop-color="' + (seriesList[0].color || '#E8461F') + '" stop-opacity="0"/></linearGradient></defs>';

    /* 0% 基准线单独强调（对比图里 0 轴最有意义） */
    sc.ticks.forEach(function (t) {
      var y = py(t);
      if (y < y0 - 1.5 || y > y1 + 1.5) return;
      var isZero = Math.abs(t) < 1e-9;
      svg += '<line x1="' + x0 + '" y1="' + y.toFixed(1) + '" x2="' + x1 + '" y2="' + y.toFixed(1) +
        '" style="stroke:' + (isZero ? 'var(--text-3)' : 'var(--line)') + '" stroke-width="1" stroke-dasharray="3 4"/>';
      svg += '<text x="' + (x1 + 5) + '" y="' + (y + 3.5).toFixed(1) + '" font-size="9.5" style="fill:' +
        (isZero ? 'var(--text-2)' : 'var(--text-3)') + '">' + esc(fmtY(t)) + '</text>';
    });

    /* 自定义基准虚线（如覆盖率卡的 100% 🎉）：独立于刻度线，只在值落在量程内时画 */
    if (opts.hline && opts.hline.value !== undefined) {
      var hv = Number(opts.hline.value);
      if (isFinite(hv) && hv >= sc.lo && hv <= sc.hi) {
        var hy = py(hv);
        svg += '<line x1="' + x0 + '" y1="' + hy.toFixed(1) + '" x2="' + x1 + '" y2="' + hy.toFixed(1) +
          '" style="stroke:' + (opts.hline.color || 'var(--payout)') + '" stroke-width="1.2" stroke-dasharray="5 4"/>';
        if (opts.hline.label) {
          svg += '<text x="' + (x0 + 4) + '" y="' + (hy - 4).toFixed(1) + '" font-size="9.5" style="fill:' +
            (opts.hline.color || 'var(--payout)') + '">' + esc(opts.hline.label) + '</text>';
        }
      }
    }

    /* 蜡烛（可选，指数）—— 先画，避免压住折线 */
    if (opts.candles && opts.candles.length) {
      var candleColor = opts.candleColor || '#8E8E93';
      var bw = Math.max(2.5, Math.min(10, (x1 - x0) / Math.max(dates.length, 1) * 0.66));
      opts.candles.forEach(function (c) {
        var i = di[c.date];
        if (i === undefined) return;
        var x = px(i);
        var up = c.c >= c.o;
        var col = up ? '#E0312F' : '#12A150';
        var yo = py(c.o), yc = py(c.c), yh = py(c.h), yl = py(c.l);
        svg += '<line x1="' + x.toFixed(1) + '" y1="' + yh.toFixed(1) + '" x2="' + x.toFixed(1) +
          '" y2="' + yl.toFixed(1) + '" stroke="' + col + '" stroke-width="1" vector-effect="non-scaling-stroke"/>';
        var top = Math.min(yo, yc), hgt = Math.max(1, Math.abs(yc - yo));
        svg += '<rect x="' + (x - bw / 2).toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) +
          '" height="' + hgt.toFixed(1) + '" fill="' + (up ? 'none' : col) + '" stroke="' + col +
          '" stroke-width="1" vector-effect="non-scaling-stroke"/>';
      });
      void candleColor;
    }

    /* 面积填充（可选，opts.area）：只支持第一条曲线（渐变 gid 只绑定了它的颜色）。
       画在折线之下 —— 先插面积 path，再走下面的折线循环。 */
    if (opts.area && seriesList[0] && seriesList[0].points.length > 1) {
      var s0 = seriesList[0];
      var d0 = s0.points.map(function (p, i) {
        return (i ? 'L' : 'M') + px(di[p.date]).toFixed(1) + ' ' + py(p.pct).toFixed(1);
      }).join('');
      if (d0) {
        var lastPt = s0.points[s0.points.length - 1];
        var areaPath = d0 + ' L' + px(di[lastPt.date]).toFixed(1) + ' ' + y1.toFixed(1) +
          ' L' + px(di[s0.points[0].date]).toFixed(1) + ' ' + y1.toFixed(1) + ' Z';
        svg += '<path d="' + areaPath + '" fill="url(#' + gid + ')" stroke="none"/>';
      }
    }

    /* 曲线 */
    seriesList.forEach(function (s) {
      var d = s.points.map(function (p, i) {
        return (i ? 'L' : 'M') + px(di[p.date]).toFixed(1) + ' ' + py(p.pct).toFixed(1);
      }).join('');
      if (!d) return;
      svg += '<path d="' + d + '" fill="none" stroke="' + (s.color || '#E8461F') +
        '" stroke-width="' + (s.width || 1.8) + '"' +
        (s.dash ? ' stroke-dasharray="' + esc(s.dash) + '" stroke-linecap="butt"' : ' stroke-linecap="round"') +
        ' stroke-linejoin="round"/>';
    });

    /* 散点标记（如「除权除息日」）—— 画在曲线之上、拖动标记之下。
       每个散点先「吸附」到**第一条曲线上最近的已有日期**，再取该日期的值定位。
       为什么是「第一条曲线自己的日期」而不是横轴并集：并集里可能混入别的曲线
       （比如余额宝基准）独有的日期，吸附过去就会取不到值而整个标记消失。
       这样也保证散点永远落在曲线上，且不会插入非均匀的时间格。
       吸附距离超过 MARK_SNAP_DAYS 就丢弃，避免把十年外的日期吸到曲线最左端画出假点。 */
    if (opts.markers && opts.markers.length && seriesList[0]) {
      var mcolor = opts.markerColor || '#E8862A';
      var s0 = seriesList[0];
      var s0dates = s0.points.map(function (p) { return p.date; }).slice().sort();
      var v0 = {};
      s0.points.forEach(function (p) { v0[p.date] = p.pct; });
      var marks = '';
      var lastDate = s0dates[s0dates.length - 1];
      opts.markers.forEach(function (m) {
        var md = typeof m === 'string' ? m : (m && m.date);
        if (!md) return;
        /* 晚于曲线最后一天的散点直接丢弃：它会被吸附到最右端，等于把「未来才除权」
           画成「已经发生过」，是个会误导人的位置错。等那天有价格了再画。 */
        if (md > lastDate) return;
        var idx = nearestDateIndex(s0dates, md);
        if (idx < 0) return;
        var snapped = s0dates[idx];
        if (dayGap(snapped, md) > MARK_SNAP_DAYS) return;
        var val = U.num(v0[snapped]);
        if (val === null) return;
        marks += '<circle cx="' + px(di[snapped]).toFixed(1) + '" cy="' + py(val).toFixed(1) +
          '" r="3.1" fill="' + mcolor + '"/>';
      });
      if (marks) svg += '<g class="xjc-marks">' + marks + '</g>';
    }

    /* 横轴日期 */
    var want = opts.xTicks || 4;
    var idxs = [], seen = {};
    for (var k = 0; k < want; k++) {
      var ii = Math.round(k * (n - 1) / (want - 1));
      if (!seen[ii]) { seen[ii] = 1; idxs.push(ii); }
    }
    idxs.forEach(function (i) {
      var anchor = (i === 0) ? 'start' : (i === n - 1) ? 'end' : 'middle';
      svg += '<text x="' + px(i).toFixed(1) + '" y="' + (y1 + 15) + '" font-size="9.5" style="fill:var(--text-3)" ' +
        'text-anchor="' + anchor + '">' + esc(ymdShort(dates[i])) + '</text>';
    });

    /* 拖动标记：竖向高亮带 + 多值气泡
       气泡宽度按内容估算 —— 早先写死 132，长名字/长金额会被截断（用户反馈「净资产显示不完整」） */
    var rowH = 15;
    var estW = function (t, fs) {
      var w = 0, str = String(t === null || t === undefined ? '' : t);
      for (var k = 0; k < str.length; k++) {
        w += str.charCodeAt(k) > 0x2e80 ? fs : fs * 0.56;   // CJK 按整字宽，其余按半宽估
      }
      return w;
    };
    var bubW = 96;
    seriesList.forEach(function (s) {
      /* 名字（最多显示 6 字）+ 数值（按最长的可能形态估） */
      var nmW = estW(String(s.name || '').slice(0, 6), 9.5);
      var valW = estW(opts.unit === 'money' ? '-¥0,000,000' : '-000.00%', 9.5);
      bubW = Math.max(bubW, 21 + nmW + 16 + valW + 11);
    });
    var bubH = seriesList.length * rowH + 16;
    svg += '<g class="xjc-cmpmarker" style="display:none">' +
      '<rect class="xjc-band" y="' + y0 + '" width="14" height="' + (y1 - y0) + '" fill="#E8A87C" fill-opacity="0.18" rx="2"/>' +
      '<line class="xjc-vline" y1="' + y0 + '" y2="' + y1 + '" style="stroke:var(--text-3)" stroke-width="1" stroke-dasharray="3 3"/>' +
      '<g class="xjc-cmpbub">' +
      '<rect rx="7" width="' + bubW + '" height="' + bubH + '" fill="rgba(28,28,30,0.92)"/>' +
      '<text class="xjc-cmpd" x="11" y="12" font-size="9" fill="rgba(255,255,255,0.66)"></text>' +
      seriesList.map(function (s, r) {
        return '<g class="xjc-cmprow" data-row="' + r + '">' +
          '<circle cx="10" cy="' + (18 + r * rowH + 4) + '" r="3" fill="' + (s.color || '#fff') + '"/>' +
          '<text class="xjc-cmpn" x="18" y="' + (21 + r * rowH + 4) + '" font-size="9.5" fill="rgba(255,255,255,0.8)"></text>' +
          '<text class="xjc-cmpv" x="' + (bubW - 8) + '" y="' + (21 + r * rowH + 4) +
          '" font-size="9.5" font-weight="700" fill="#fff" text-anchor="end"></text>' +
          '</g>';
      }).join('') +
      '</g></g>';

    svg += '</svg>';
    return svg;
  }

  /* ---------------- 时间范围选择条（brush） ----------------
   * 参考图底部那条：一条概览曲线 + 左右两个抓手指明当前可见区间。
   *
   * 为什么独立成第二个 <svg> 而不是画进主图：
   *   1) 拖动时要实时重画主图。若抓手和主图同在一个 <svg> 里，
   *      重画 innerHTML 会把抓手自身也删掉，正在进行的 pointer capture 随之中断、手势直接断；
   *   2) 完全不用去动主图 CPR / CPB 的底部留白与 px/py 坐标换算。
   *
   * BG_LABEL_Y 之上是两端日期标签（与参考图一致：日期在主图与概览条之间）。
   */
  var BW = 360, BH = 54;
  var B_LABEL_Y = 9, B_TOP = 18, B_BOT = 50;
  var B_HANDLE_W = 15, B_HANDLE_H = 22, B_MIN_SPAN = 2;

  /* 渲染输入按 chartKey 存一份：brush 拖动时要据此切片重画主图。
     不放在 DOM 的 data-* 里 —— 十年 × 多列的 JSON 塞进属性既慢又易踩转义坑。 */
  var brushReg = {};

  function brushX(idx, n) { return n > 1 ? (idx / (n - 1)) * BW : BW / 2; }

  function handleMarkup(side) {
    var s = '<g class="xjc-brush-h" data-side="' + side + '">' +
      '<rect x="' + (-B_HANDLE_W / 2) + '" y="' + (-B_HANDLE_H / 2) + '" width="' + B_HANDLE_W + '" height="' + B_HANDLE_H +
      '" rx="5" style="fill:var(--bg-elev);stroke:var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    /* 参考图抓手上的「III」三道竖线 */
    [-3, 0, 3].forEach(function (dx) {
      s += '<line x1="' + dx + '" y1="-5" x2="' + dx + '" y2="5" style="stroke:var(--text-3)" stroke-width="1.4" ' +
        'stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
    });
    return s + '</g>';
  }

  /**
   * @param points [{date, y}] 概览用的全量序列（升序，至少 2 点）
   * @param opts   { chartKey, begIdx, endIdx, onChange(begDate, endDate, isFinal), color }
   * @return SVG 字符串；points 不足时返回 ''
   */
  function brush(points, opts) {
    opts = opts || {};
    var list = (points || []).filter(function (p) { return p && p.date && U.num(p.y) !== null; });
    if (list.length < 2) return '';
    var key = opts.chartKey || 'cmp';
    var n = list.length;
    var i0 = Math.max(0, Math.min(n - 1, U.num(opts.begIdx) === null ? 0 : Math.round(U.num(opts.begIdx))));
    var i1 = Math.max(0, Math.min(n - 1, U.num(opts.endIdx) === null ? n - 1 : Math.round(U.num(opts.endIdx))));
    if (i1 - i0 < B_MIN_SPAN) i1 = Math.min(n - 1, i0 + B_MIN_SPAN);
    if (i1 - i0 < B_MIN_SPAN) i0 = Math.max(0, i1 - B_MIN_SPAN);

    brushReg[key] = { points: list, opts: opts };

    var vals = list.map(function (p) { return U.num(p.y) || 0; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var span = (hi - lo) || Math.max(Math.abs(hi) * 0.001, 1e-6);
    function by(v) { return B_BOT - ((v - lo) / span) * (B_BOT - B_TOP); }

    var line = '';
    for (var k = 0; k < n; k++) {
      line += (k ? 'L' : 'M') + brushX(k, n).toFixed(1) + ' ' + by(vals[k]).toFixed(1);
    }
    var area = line + ' L' + BW + ' ' + B_BOT + ' L0 ' + B_BOT + ' Z';
    var color = opts.color || '#7FA6D9';
    var xa0 = brushX(i0, n), xb0 = brushX(i1, n);

    var svg = '<svg viewBox="0 0 ' + BW + ' ' + BH + '" class="xj-brush" data-brush="' + esc(key) +
      '" data-n="' + n + '">' +
      '<text class="xjc-brush-beg" x="0" y="' + B_LABEL_Y + '" font-size="10.5" style="fill:var(--text-2)">' +
      esc(list[i0].date) + '</text>' +
      '<text class="xjc-brush-end" x="' + BW + '" y="' + B_LABEL_Y +
      '" font-size="10.5" style="fill:var(--text-2)" text-anchor="end">' + esc(list[i1].date) + '</text>' +
      '<rect x="0" y="' + B_TOP + '" width="' + BW + '" height="' + (B_BOT - B_TOP) +
      '" rx="7" style="fill:var(--glass-bg-2)"/>' +
      '<path d="' + area + '" fill="' + color + '" fill-opacity="0.34"/>' +
      /* 选中区间之外压一层浅色蒙版（参考图就是这个效果） */
      '<rect class="xjc-brush-mask" data-side="l" x="0" y="' + B_TOP + '" width="' + xa0.toFixed(1) +
      '" height="' + (B_BOT - B_TOP) + '" style="fill:var(--glass-bg-2)" fill-opacity="0.78"/>' +
      '<rect class="xjc-brush-mask" data-side="r" x="' + xb0.toFixed(1) + '" y="' + B_TOP + '" width="' +
      Math.max(0, BW - xb0).toFixed(1) + '" height="' + (B_BOT - B_TOP) + '" style="fill:var(--glass-bg-2)" fill-opacity="0.78"/>' +
      '<rect class="xjc-brush-sel" x="' + xa0.toFixed(1) + '" y="' + (B_TOP - 1) + '" width="' +
      Math.max(0, xb0 - xa0).toFixed(1) + '" height="' + (B_BOT - B_TOP + 2) +
      '" fill="none" style="stroke:var(--brush-line)" stroke-width="1" rx="6" vector-effect="non-scaling-stroke"/>' +
      '<g class="xjc-brush-hl" data-side="l" transform="translate(' + xa0.toFixed(1) + ',' + ((B_TOP + B_BOT) / 2) + ')">' +
      handleMarkup('l') + '</g>' +

      '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.20"/>' +
      '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/>' +

/* ==================== 计算引擎（纯函数为主） ====================
 * 除 applyAutoReceived 外，全部为无副作用纯函数：不碰 DOM、不碰存储。
 * 口径说明：
 *  - 金额单位「元」，数量单位「股」
 *  - 预计到账 / 预测分红一律使用【税前】每股派息，与「息记」口径一致
 *  - 实时股息率 = 近 12 个月已实施分配的每股税前分红合计 ÷ 现价

XJ.calc = (function () {
  var U = XJ.util;
  var ALL = '__all__';

  /* ---------------- 基础 ---------------- */

    return perSharePretax(plan);
  }
  /**
   * 派息落地日期（到账日）。优先级：
   *   1) plan.payoutDate —— 仅当数据源确实给了独立派息日时采用（基金 / 港股）
   *   2) 除权除息日      —— A 股数据源没有独立派息日字段，且按产品口径
   *                        「A 股派息日 = 除权除息日」（同一天），不做 T+1 推算
   *   3) 股权登记日      —— 兜底
   * exact=true 表示是数据源给出的确定日期，UI 才可以说「派息日」而非「预计派息日」。
   */

    var hasRealPayout = (plan.source === 'hk' || plan.source === 'fund') && plan.payoutDate;
    if (hasRealPayout) return { date: plan.payoutDate, exact: true };
    if (plan.exDividendDate) return { date: plan.exDividendDate, exact: false };
    if (plan.equityRecordDate) return { date: plan.equityRecordDate, exact: false };
    if (plan.payoutDate) return { date: plan.payoutDate, exact: true };
    return { date: null, exact: false };
  }
  function payoutDate(plan) { return payoutInfo(plan).date; }

  /**
   * 分红【归属锚点】——用于「近 12 个月」这类时间窗口统计。
   * 锚点是除权除息日：红利在除权除息日即归属持有人，
   * 若用「发放日」做锚点，会出现除权后、发放前这几天该笔分红凭空消失的怪异现象。
   */
  function dividendAnchor(plan) {
    return plan.exDividendDate || plan.equityRecordDate || plan.payoutDate || null;

    var keys = Object.keys(state.plans);

   *   { type:'years',  value:N }   近 N 个完整财年（默认 {years,1}，即「最近一财年」）
   *   { type:'custom', startYear } 自选起始财年

   *   分子 = 报告年度 ∈ [Y−分母+1, Y] 的全部已实施方案每股税前分红（含各财年中报）

    var impl = plans.filter(function (p) { return p.isImplemented; });
    if (!impl.length) return { perShare: 0, total: 0, basis: 'none', year: null, years: 0 };

    // 基金分红不定期（可能一年多次、也可能不分配），按近 12 个月年化更贴近事实
    if (impl[0].source === 'fund') {
      var ft = trailingPerShare(plans, U.today());
      return { perShare: ft, total: ft, basis: 'fundTtm', year: null, years: 0 };
    }

    var allYears = impl.map(reportYear).filter(function (y) { return y; });
    var annualYears = impl.filter(isAnnualReport).map(reportYear).filter(function (y) { return y; });

    if (annualYears.length) {
      var latestYear = Math.max.apply(null, annualYears);
      var earliestYear = Math.min.apply(null, allYears);
      var available = Math.max(1, latestYear - earliestYear + 1);

      var b = basis || { type: 'years', value: 1 };
      var requested;
      if (b.type === 'custom' && b.startYear) {
        requested = Math.max(1, latestYear - U.num(b.startYear) + 1);
      } else {
        requested = Math.max(1, Math.round(U.n0(b.value) || 1));
      }

      var use = Math.min(requested, available);
      var fromYear = latestYear - use + 1;
      var grp = impl.filter(function (p) {
        var y = reportYear(p);
        return y >= fromYear && y <= latestYear;
      });
      var total = U.sum(grp, perSharePretax);

      return {
        perShare: total / use,
        total: total,
        basis: 'fiscal',
        year: latestYear,
        fromYear: fromYear,
        years: use,
        requested: requested,
        available: available,
        capped: use < requested,          // 数据不足 N 年，已按可用年数计算
      };
    }

    var ttm = trailingPerShare(plans, U.today());
    if (ttm > 0) return { perShare: ttm, total: ttm, basis: 'ttm', year: null, years: 0 };

    var latest = impl.slice().sort(function (a, b2) { return a.reportDate < b2.reportDate ? 1 : -1; })[0];
    var single = perSharePretax(latest);
    return { perShare: single, total: single, basis: 'single', year: reportYear(latest), years: 0 };
  }

  /* ---------------- 股息率曲线（财年口径） ----------------
   * 口径：某时点的股息率 = 该财年派现总额 ÷ 当时总市值 × 100%
   *                       = 该财年每股派现合计 ÷ 当时股价 × 100%
   * （总股本在分子分母中约掉；历史时点的总股本拿不到，且这与东财 DIVIDENT_RATIO 同一口径。）
   *
   * 与 annualBasePerShare 的两个关键差别：
   *   1) 分子**含已公告的预案**（不过滤 isImplemented）—— 因为生效时点选的是「预案公告日」，
   *      若只算已实施，公告日切换就形同虚设（要等 2~3 个月后的除权除息日才生效）。
   *   2) 只认**含年报**的财年：「上一年财报」指年报，光有中报不足以为一个财年定调。
   */

  /**
   * 财年分子表。返回 [{ year, perShare, effectiveFrom, annualPlans }]，按 year 升序。
   *   year          报告年度
   *   perShare      该财年【全部】方案的每股税前派现合计（含中报/季报，含预案）
   *   effectiveFrom 该财年的生效日 = 年报方案的预案公告日
   *                 （退化为 noticeDate → equityRecordDate → exDividendDate；全缺则不入选）
   *   annualPlans   该财年的年报方案条数
   */
  function yieldFiscalSteps(plans) {
    var byYear = {};
    (plans || []).forEach(function (p) {
      if (!p) return;
      var y = reportYear(p);
      if (!y) return;
      if (!byYear[y]) byYear[y] = { sum: 0, annual: [] };
      byYear[y].sum += perSharePretax(p);
      if (isAnnualReport(p)) byYear[y].annual.push(p);
    });

    var out = [];
    Object.keys(byYear).forEach(function (key) {
      var y = U.num(key);
      var g = byYear[key];
      if (!y || !g.annual.length) return;          // 没有年报的财年不作候选
      if (!(g.sum > 0)) return;                    // 该财年一分钱都没派 → 不参与（股息率 0 无意义）
      /* 生效日取该财年最早一条年报方案的公告日；缺则沿退化链往下找 */
      var best = null;
      g.annual.forEach(function (p) {
        var d = p.planNoticeDate || p.noticeDate || p.equityRecordDate || p.exDividendDate || null;
        if (!d) return;
        if (!best || d < best) best = d;
      });
      if (!best) return;                           // 连公告日都拿不到 → 无法定生效时点
      out.push({ year: y, perShare: g.sum, effectiveFrom: best, annualPlans: g.annual.length });
    });

    out.sort(function (a, b) { return a.year - b.year; });
    return out;
  }

  /**
   * 股息率时间序列。
   * @param plans  该标的的全部 DividendPlan（含预案）
   * @param closes [['YYYY-MM-DD', close], ...] 升序（不复权收盘价）
   * @return [{ date, y, year }] —— y 为百分比；生效日之前的点不产出（曲线自然从第一个财年起）
   *
   * 用双指针推进财年，整体 O(n+m)。分子在一年内是常数，只有到了下一年报预案公告日才跳一次 ——
   * 所以曲线上的「台阶」位置就是各年年报的公告日，这是符合预期且可验证的。
   */
  function dividendYieldSeries(plans, closes) {
    var steps = yieldFiscalSteps(plans);
    if (!steps.length) return [];
    var list = closes || [];
    var out = [];
    var si = -1;                                   // 当前生效的财年下标
    for (var i = 0; i < list.length; i++) {
      var row = list[i];
      if (!row || row.length < 2) continue;
      var d = String(row[0]).slice(0, 10);
      var c = U.num(row[1]);
      if (c === null || !(c > 0)) continue;
      /* 把所有「生效日 <= 当天」的财年都吃掉，最后一个即为当前生效的 */
      while (si + 1 < steps.length && steps[si + 1].effectiveFrom <= d) si++;
      if (si < 0) continue;                        // 还没到任何一个财年的生效日
      var s = steps[si];
      out.push({ date: d, y: s.perShare / c * 100, year: s.year });
    }
    return out;
  }

  /* ---------------- 平均股息率线（分财年） ----------------
   *
   * 为什么必须「分财年」而不是全期一个均值：
   * 一个财年窗口内分子（每股派现合计）是常数，所以「该财年的平均股息率」完全由价格决定，
   * 于是「高于 / 低于均线」才能被读成估值位置的相对高低。
   * 若改用全期单一均值（方案A），均线的高/低于就被分子档位锁死 ——
   * 实测中远海控 2022-01-01 起 1142 个交易日里，只有 FY2022 那 241 天高于全期均值、
   * 其余 901 天恒为「低于」，穿越次数仅 2 次，信号等于失效。
   * （对照：分财年口径下同一标的穿越 54 次。）
   */

  /** 平均股息率线的样本起点（用户定：日历年 2022-01-01 起） */
  var YIELD_AVG_FROM = '2022-01-01';
  /** 整年窗口口径的最小样本量：不足则该财年段整段不画。120 个交易日 ≈ 半年。 */
  var YIELD_AVG_MIN_DAYS = 120;

  /**
   * 分财年平均股息率（统计口径，供界面读文案用）。
   *
   * @param plans  该标的的全部 DividendPlan
   * @param closes [['YYYY-MM-DD', close], ...] 升序
   * @return [{ year, perShare, from, to, days, avg, ok }]
   *         avg 为百分比；ok=false 表示样本 < YIELD_AVG_MIN_DAYS（界面据此提示、不绘制）
   *
   * 样本一律从 YIELD_AVG_FROM 起算，所以跨 2022 年初的那个财年只取到后半段
   * （长江电力 FY2020 只剩 77 天 → ok=false → 不画）。
   */
  function yieldYearAverages(plans, closes) {
    var shareOf = {};
    yieldFiscalSteps(plans).forEach(function (s) { shareOf[s.year] = s.perShare; });

    var out = [];
    var cur = null;
    dividendYieldSeries(plans, closes).forEach(function (p) {
      if (p.date < YIELD_AVG_FROM) return;
      /* 财年档沿时间单调递增（steps 按 year 排序、effectiveFrom 随之递增），
         所以按「相邻不同年」切段是安全的，同一年不会分成两段。 */
      if (!cur || cur.year !== p.year) {
        cur = { year: p.year, sum: 0, days: 0, from: p.date, to: p.date };
        out.push(cur);
      }
      cur.sum += p.y; cur.days++; cur.to = p.date;
    });

    out.forEach(function (g) {
      g.avg = g.days ? g.sum / g.days : null;
      g.perShare = shareOf[g.year] === undefined ? null : shareOf[g.year];
      g.ok = g.days >= YIELD_AVG_MIN_DAYS;
    });
    return out;
  }

  /**
   * 平均股息率线（可直接画进图表的点序列，与股息率曲线同轴）。
   *
   * mode='year' 该财年【整段窗口】的均值 → 每财年一条水平线（阶梯）；
   *             样本不足的财年整段不画（避免用半年的样本冒充一年的水平）。
   * mode='cum'  从该财年生效日起【逐日累积】的均值 → 是个爬升的曲线，
   *             无前视偏差（只用当日及之前的样本），所以**不设样本门槛** ——
   *             「样本少所以均值不可信」正是它要如实反映的东西。
   *
   * 两种口径都只在【该财年窗口内】取样本，因此均线的起伏只由价格产生；
   * 差别仅在于「是否用到了本财年后面才发生的价格」。
   *
   * @return [{ date, y, year, enough }] —— y 为百分比
   */
  function yieldAverageSeries(plans, closes, mode) {
    var cum = mode === 'cum';
    var avgOf = {}, okOf = {};
    yieldYearAverages(plans, closes).forEach(function (g) {
      avgOf[g.year] = g.avg; okOf[g.year] = g.ok;
    });

    var out = [];
    var cur = null;
    dividendYieldSeries(plans, closes).forEach(function (p) {
      if (p.date < YIELD_AVG_FROM) return;
      if (!cur || cur.year !== p.year) cur = { year: p.year, sum: 0, days: 0 };
      cur.sum += p.y; cur.days++;
      if (cum) {
        out.push({ date: p.date, y: cur.sum / cur.days, year: p.year, enough: true });
        return;
      }
      if (!okOf[p.year]) return;
      out.push({ date: p.date, y: avgOf[p.year], year: p.year, enough: true });
    });
    return out;
  }

  /** 除权除息日清单（升序、去重），供曲线打散点用 */
  function exDividendDates(plans) {
    var seen = {};
    (plans || []).forEach(function (p) {
      var d = p && p.exDividendDate;
      if (!d) return;
      d = String(d).slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      seen[d] = 1;
    });
    return Object.keys(seen).sort();
  }

  /* ---------------- 持仓成本 ---------------- */

  function cmpTx(a, b) {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    var ca = a.createdAt || '', cb = b.createdAt || '';
    if (ca !== cb) return ca < cb ? -1 : 1;
    return (a.txId || '') < (b.txId || '') ? -1 : 1;
  }

  /**
   * 持仓核心。costMethod：
   *   'weighted'        加权平均（默认，原有行为，卖出产生已实现盈亏）
   *   'diluted'         摊薄成本 = (买入总额 − 卖出总额) ÷ 持股数
   *   'dividendDiluted' 分红摊薄 = (净投入 − 累计已收分红) ÷ 持股数
   * 摊薄类口径下「已实现盈亏」无意义，统一置 0（由上层隐藏该指标）。
   * receivedTotal 仅在 costMethod='dividendDiluted' 时参与计算。
   */
  /**
   * 默认成本口径：**分红摊薄** —— 分红到账后持仓成本自动下降。
   * 与 model.DEFAULT_COST_METHOD 保持一致；这里再兜一层，
   * 是为了让「没有显式写过 costMethod 的老记录」也按分红摊薄算（否则分红不会摊薄成本）。
   */
  function defaultCostMethod() {
    return (XJ.model && XJ.model.DEFAULT_COST_METHOD) || 'dividendDiluted';
  }

  function position(txs, upToDate, costMethod, receivedTotal) {
    var list = txs.slice().sort(cmpTx);
    var qty = 0, costBasis = 0, avg = 0, realized = 0;
    var buyAmount = 0, sellAmount = 0, buyFees = 0, sellFees = 0, count = 0;
    var adjustAmount = 0;

    for (var i = 0; i < list.length; i++) {
      var t = list[i];
      if (upToDate && t.date > upToDate) break;
      count++;

      /* 「成本调整」：只加减成本基础，不改变股数。
         股数为 0（已清仓）时忽略，否则会凭空造出一个金额而无对应股数。 */
      if (t.action === 'ADJUST') {
        if (qty > 0) {
          var a = U.n0(t.amount);
          costBasis += a;
          adjustAmount += a;
          avg = qty > 0 ? costBasis / qty : 0;
        }
        continue;
      }

      var q = U.n0(t.quantity), p = U.n0(t.price), f = U.n0(t.fee);
      if (t.action === 'BUY') {
        costBasis += q * p + f;
        qty += q;
        buyAmount += q * p;
        buyFees += f;
        avg = qty > 0 ? costBasis / qty : 0;
      } else {
        var sq = Math.min(q, qty);
        realized += sq * (p - avg) - f;
        costBasis -= sq * avg;
        qty -= sq;
        sellAmount += sq * p;
        sellFees += f;
        if (qty <= 1e-9) { qty = 0; costBasis = 0; avg = 0; }
        else avg = costBasis / qty;
      }
    }

    /* 净投入 = 买入总额 − 卖出净得 + 成本调整（调整是对真实投入的修正，理应计入） */
    var net = (buyAmount + buyFees) - (sellAmount - sellFees) + adjustAmount;

    var method = costMethod || defaultCostMethod();
    if (method !== 'weighted' && qty > 0) {
      var basis = net;
      if (method === 'dividendDiluted') basis -= U.n0(receivedTotal);
      costBasis = basis;
      avg = basis / qty;
      realized = 0;                       // 摊薄口径下不谈已实现盈亏
    }

    return {
      qty: qty, avgCost: avg, costBasis: costBasis, realized: realized,
      buyAmount: buyAmount, sellAmount: sellAmount, adjustAmount: adjustAmount,
      buyFees: buyFees, sellFees: sellFees, fees: buyFees + sellFees,
      netInvested: net, count: count, costMethod: method,
    };
  }

  function txOf(state, accountId, symbol) {
    return state.transactions.filter(function (t) {
      if (symbol && t.symbol !== symbol) return false;
      if (accountId && accountId !== ALL && t.accountId !== accountId) return false;
      return true;
    });
  }

  /* ---------------- 持仓明细 ---------------- */

  function holdings(state, accountId) {
    var acc = accountId || ALL;
    var bySym = {};
    state.transactions.forEach(function (t) {
      if (acc !== ALL && t.accountId !== acc) return;
      (bySym[t.symbol] || (bySym[t.symbol] = [])).push(t);
    });

    /* 该账户下每只标的的累计已收分红（分红摊薄成本与回本进度都要用） */
    var receivedBySym = {};
    state.received.forEach(function (r) {
      if (acc !== ALL && r.accountId !== acc) return;
      receivedBySym[r.symbol] = (receivedBySym[r.symbol] || 0) + U.n0(r.amount);
    });

    var today = U.today();
    var rows = [];

    Object.keys(bySym).forEach(function (sym) {
      var txs = bySym[sym];
      var meta = state.symbols[sym] || {};
      var costMethod = meta.costMethod || defaultCostMethod();
      var recvTotal = receivedBySym[sym] || 0;

      var pos = position(txs, null, costMethod, recvTotal);
      if (pos.qty <= 0) return;                       // 已清仓不进持仓列表

      var q = state.quoteCache[sym] || null;
      var price = q ? U.num(q.price) : null;
      var name = (q && q.name) || meta.name || XJ.model.codeOf(sym);

      var plans = plansOf(state, sym);
      var ttm = trailingPerShare(plans, today);
      var annual = annualBasePerShare(plans, meta.dividendBasis);

      var marketValue = price ? pos.qty * price : null;
      var costValue = pos.qty * pos.avgCost;           // 摊薄口径下可能为负
      var unrealized = price ? marketValue - costValue : null;
      var unrealizedPct = (price && costValue > 0) ? unrealized / costValue * 100 : null;

      /* 股价息率：与预测分红同用财年口径；缺财年方案时退回 TTM */
      var yldPerShare = annual.perShare > 0 ? annual.perShare : ttm;
      var dividendYield = (price && price > 0 && yldPerShare > 0) ? yldPerShare / price * 100 : null;

      var predictedDividend = pos.qty * annual.perShare;

      /* 成本息率：成本为负（已回本）时不显示百分比 */
      var costYield = costValue > 0 ? predictedDividend / costValue * 100 : null;
      var marketYield = marketValue > 0 ? predictedDividend / marketValue * 100 : null;

      /* 分红回本进度 */
      var netInvested = pos.netInvested;
      var remaining = Math.max(0, netInvested - recvTotal);
      var recoveryPct = (meta.costRecovered || netInvested <= 0)
        ? 100
        : U.clamp(recvTotal / netInvested * 100, 0, 100);
      var expectedYears = (remaining > 0 && predictedDividend > 0)
        ? remaining / predictedDividend : (remaining > 0 ? null : 0);

      /* 持股天数：首笔买入日起算 */
      var buys = txs.filter(function (t) { return t.action === 'BUY' && t.date; })
        .map(function (t) { return t.date; }).sort();
      var since = buys.length ? buys[0] : null;
      var holdDays = since ? Math.max(0, U.daysBetween(since, today) || 0) : 0;

      /* ---- 人民币口径的「金额」字段 ----
         应用的主口径是人民币：首页总市值、资产走势曲线、每日快照用的都是折算后的值。
         这里把金额类字段一并折好，避免「有的地方折、有的地方不折」——
         曾经 summary() 把港币金额当人民币直接相加，而曲线是折过的，
         结果同一个组合出现两个总市值（实测 40,000 vs 37,600）。
         ★ **原币字段全部保留不动**：buildSnapshot / netWorthAdjust / alignMinute 里
         已经各自做过折算，改这里会导致重复折算；而且 position() 的分红摊薄要用原币的分红合计。
         ★ **每股数字（price / avgCost / prevClose）不折**：港股的价格本来就是港元，
         折了反而与行情软件对不上。 */
      var rate = fxRate(XJ.market.currency(sym), (state.settings && state.settings.fx) || {});
      var marketValueCny = marketValue === null ? null : marketValue * rate;
      var costValueCny = costValue * rate;
      var unrealizedCny = marketValue === null ? null : marketValueCny - costValueCny;

      rows.push({
        symbol: sym,
        code: XJ.model.codeOf(sym),
        market: XJ.model.marketOf(sym),
        assetType: XJ.market.assetType(sym),
        kindLabel: XJ.market.kind(sym),
        currency: XJ.market.currency(sym),
        domain: (state.symbols[sym] && state.symbols[sym].domain) || null,
        /* 已解析出的公司图标 URL（由同步管线多源解析后写入 symbols[sym].logoUrl）；
           为空时视图回退到中文简称头像 */
        logoUrl: (state.symbols[sym] && state.symbols[sym].logoUrl) || null,
        adjustAmount: pos.adjustAmount,
        curSymbol: XJ.market.curSymbol(sym),
        name: name,
        qty: pos.qty,
        avgCost: pos.avgCost,
        costValue: costValue,
        costMethod: costMethod,
        costRecovered: !!meta.costRecovered,
        netInvested: netInvested,
        buyAmount: pos.buyAmount,
        sellAmount: pos.sellAmount,
        price: price,
        prevClose: q ? U.num(q.prevClose) : null,
        changePct: q ? U.num(q.changePct) : null,
        quoteTime: q ? q.quoteTime : null,
        marketValue: marketValue,
        unrealized: unrealized,
        unrealizedPct: unrealizedPct,
        realized: pos.realized,
        /* 人民币口径（汇总与界面显示 ¥ 时一律用这几个；原币字段供内部折算复用） */
        fxRate: rate,
        marketValueCny: marketValueCny,
        costValueCny: costValueCny,
        unrealizedCny: unrealizedCny,
        realizedCny: pos.realized * rate,
        netInvestedCny: netInvested * rate,
        receivedTotalCny: recvTotal * rate,
        predictedDividendCny: predictedDividend * rate,
        perShareTTM: ttm,
        dividendYield: dividendYield,
        annualPerShare: annual.perShare,
        annualBasis: annual.basis,
        annualBasisYear: annual.year,
        annualBasisYears: annual.years,
        annualBasisDetail: annual,
        predictedDividend: predictedDividend,
        yieldOnCost: costYield,
        costYield: costYield,
        marketYield: marketYield,
        receivedTotal: recvTotal,
        remaining: remaining,
        /* 人民币口径的「剩余待回收」= 净投入 − 已收分红（与上面同源，只是换算单位） */
        remainingCny: Math.max(0, netInvested * rate - recvTotal * rate),
        recoveryPct: recoveryPct,
        expectedYears: expectedYears,
        holdDays: holdDays,
        holdSince: since,
        planCount: plans.length,
        implementedCount: plans.filter(function (p) { return p.isImplemented; }).length,
        hasPlans: plans.length > 0,
      });
    });

    rows.sort(function (a, b) {
      return (b.predictedDividend || 0) - (a.predictedDividend || 0);
    });
    return rows;
  }

  /* ---------------- 组合汇总 ---------------- */

  function summary(state, accountId) {
    var acc = accountId || ALL;
    var hs = holdings(state, acc);
    var today = U.today();
    var curYear = U.yearOf(today);

    var totalMarketValue = 0, totalCost = 0, totalPredicted = 0,
      totalRealized = 0, missingQuote = 0;
    var totalTodayPnl = 0, totalPrevMv = 0;

    /* ★ 一律用人民币口径的字段（holdings 里已按各标的币种折好）。
       早先这里直接累加 h.marketValue / h.costValue（原币），
       持有港股/美股的组合会把外币金额当人民币相加，而资产走势曲线与每日快照是折过的
       → 同一个组合、同一个界面出现两个总市值。 */
    hs.forEach(function (h) {
      totalCost += h.costValueCny;
      totalPredicted += h.predictedDividendCny;
      totalRealized += h.realizedCny;
      if (h.marketValue === null) missingQuote++;
      else totalMarketValue += h.marketValueCny;

      /* 当日参考盈亏 = Σ 持股数 ×（现价 − 昨收）× 汇率（跨币种已折算）。
         缺昨收的标的（新加的、行情还没回）直接跳过 —— 绝不拿 0 当昨收，那会算出 +∞。 */
      var pc = U.num(h.prevClose), px = U.num(h.price);
      if (pc !== null && pc > 0 && px !== null && h.qty > 0) {
        var fr = U.n0(h.fxRate) || 1;
        totalTodayPnl += (px - pc) * h.qty * fr;
        totalPrevMv += pc * h.qty * fr;
      }
    });

    /* 分红同样按「该标的的币种」折算（港币分红不能当人民币加） */
    var fxNow = (state.settings && state.settings.fx) || {};
    var recvCny = function (r) {
      return U.n0(r.amount) * fxRate(XJ.market.currency(r.symbol), fxNow);
    };

    var receivedThisYear = U.sum(state.received.filter(function (r) {
      if (acc !== ALL && r.accountId !== acc) return false;
      return (r.year || U.yearOf(r.exDividendDate)) === curYear;
    }), recvCny);

    var receivedTotal = U.sum(state.received.filter(function (r) {
      return acc === ALL || r.accountId === acc;
    }), recvCny);

    var compositeYield = totalMarketValue > 0 ? totalPredicted / totalMarketValue * 100 : null;

    var ups = upcomingPayouts(state, acc, today);
    var nextPayout = ups.length ? ups[0] : null;

    /* 净投入（摊薄口径的累计投入） */
    var totalNetInvested = 0;
    /* 单只平均市值、按资产类型分组（人民币口径） */
    var byAssetType = {};
    hs.forEach(function (h) {
      totalNetInvested += h.netInvestedCny;
      var k = h.assetType || 'stock';
      var g = byAssetType[k] || (byAssetType[k] = { key: k, label: h.kindLabel, count: 0, marketValue: 0, predicted: 0 });
      g.count++;
      g.marketValue += (h.marketValueCny || 0);
      g.predicted += (h.predictedDividendCny || 0);
    });
    var assetTypeList = Object.keys(byAssetType)
      .map(function (k) { return byAssetType[k]; })
      .sort(function (a, b) { return b.marketValue - a.marketValue; });

    return {
      holdings: hs,
      count: hs.length,
      totalMarketValue: totalMarketValue,
      totalCost: totalCost,
      totalNetInvested: totalNetInvested,
      totalUnrealized: totalMarketValue - totalCost,
      totalUnrealizedPct: totalCost > 0 ? (totalMarketValue - totalCost) / totalCost * 100 : null,
      totalPredicted: totalPredicted,
      totalRealized: totalRealized,
      receivedThisYear: receivedThisYear,
      receivedTotal: receivedTotal,
      compositeYield: compositeYield,
      /* 成本息率：预测年度分红 ÷ 总成本（成本非正时不显示） */
      costYield: totalCost > 0 ? totalPredicted / totalCost * 100 : null,
      /* 市值息率：预测年度分红 ÷ 总市值 */
      marketYield: compositeYield,
      /* 月均预测分红：预测年度分红 ÷ 12 */
      monthlyDividend: totalPredicted / 12,
      avgMarketValue: hs.length ? totalMarketValue / hs.length : 0,
      byAssetType: assetTypeList,
      missingQuote: missingQuote,
      nextPayout: nextPayout,
      upcomingCount: ups.length,
      /* 当日参考盈亏：现价相对【昨收】的浮动，人民币口径；不含当日已到账分红。
         todayPnlPct = ÷ 昨收市值（= 组合当日涨跌幅），分母 ≤ 0 时为 null。 */
      todayPnl: Math.round(totalTodayPnl * 100) / 100,
      todayPnlPct: totalPrevMv > 0 ? Math.round(totalTodayPnl / totalPrevMv * 10000) / 100 : null,
    };
  }

  /* ---------------- 分红日历事件 ---------------- */

  /**
   * 生成日历事件（只针对当前账户持有的标的）。
   * 派息日字段缺失，统一按「除权除息日 T+1」推算并标注为【预计到账】。
   */
  function calendarEvents(state, accountId, fromDate, toDate) {
    var acc = accountId || ALL;
    var hs = holdings(state, acc);
    var out = [];
    var today = U.today();

    hs.forEach(function (h) {
      var txs = txOf(state, acc, h.symbol);
      var plans = plansOf(state, h.symbol);
      plans.forEach(function (p) {
        var hasDate = p.equityRecordDate || p.exDividendDate;
        if (!hasDate) return;

        var posAtReg = position(txs, p.equityRecordDate || p.exDividendDate);
        var qty = posAtReg.qty > 0 ? posAtReg.qty : h.qty;
        var ps = perSharePretax(p);
        var amount = qty * ps;

        var pay = payoutInfo(p);
        var seq = [];
        if (p.equityRecordDate) seq.push({ type: 'register', date: p.equityRecordDate, label: '股权登记日', amount: null });
        if (p.exDividendDate) seq.push({ type: 'exdiv', date: p.exDividendDate, label: '除权除息日', amount: null });
        if (pay.date) seq.push({
          type: 'payout', date: pay.date, amount: amount,
          // 决策 D5：统一用「派息日」；A 股为推算值，故标注「预计」
          label: pay.exact ? '派息日' : '预计派息日',
        });

        seq.forEach(function (e) {
          if (fromDate && e.date < fromDate) return;
          if (toDate && e.date > toDate) return;
          out.push({
            date: e.date,
            type: e.type,
            label: e.label,
            symbol: h.symbol,
            name: h.name,
            code: h.code,
            planId: p.planId,
            reportDate: p.reportDate,
            reportType: p.reportType,
            perShare: ps,
            perShareProfile: p.implPlanProfile,
            qty: qty,
            amount: e.amount,
            assignProgress: p.assignProgress,
            isImplemented: p.isImplemented,
            // 只有「到账」事件可能是推算值；登记日/除权日是数据源给定的事实
            isEstimate: e.type === 'payout' ? !pay.exact : false,
            isEstimatePayout: !pay.exact,
            status: e.date > today ? 'UPCOMING' : e.date === today ? 'TODAY' : 'DONE',
          });
        });
      });
    });

    out.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (b.amount || 0) - (a.amount || 0);
    });
    return out;
  }

  /** 待收分红（派息日在今天之后），按日期升序 */
  function upcomingPayouts(state, accountId, fromDate) {
    var evs = calendarEvents(state, accountId, fromDate || U.today(), null);
    return evs.filter(function (e) { return e.type === 'payout'; });
  }

  /** 某月的日历数据：格子事件 + 本月待收统计 */
  function monthView(state, accountId, year, month) {
    var ym = year + '-' + U.pad2(month);
    var from = ym + '-01';
    var to = ym + '-' + U.pad2(new Date(year, month, 0).getDate());
    var evs = calendarEvents(state, accountId, from, to);

    var byDate = {};
    evs.forEach(function (e) { (byDate[e.date] || (byDate[e.date] = [])).push(e); });

    var today = U.today();
    var pending = evs.filter(function (e) { return e.type === 'payout' && e.date >= today; });
    var monthTotal = U.sum(pending, function (e) { return e.amount; });
    var receivedInMonth = U.sum(evs.filter(function (e) { return e.type === 'payout' && e.date < today; }),
      function (e) { return e.amount; });

    return {
      ym: ym, year: year, month: month, from: from, to: to,
      events: evs, byDate: byDate,
      pendingCount: pending.length, pendingTotal: monthTotal, receivedTotal: receivedInMonth,
    };
  }

  /* ---------------- 息覆生活 ---------------- */

  function coverage(annualDividend, expenses, assumedYieldPct) {
    var ay = assumedYieldPct === undefined || assumedYieldPct === null ? 7 : U.n0(assumedYieldPct);
