      : '每股派息 ' + U.money(e.perShare, 4) + ' · 登记数量 ' + U.thousands(e.qty) + ' 股';
    return '<button class="list-row" data-act="openSymbol" data-symbol="' + U.esc(e.symbol) + '">' +
      UI.avatar(e.name, e.symbol, 38, C.logoFor(e.symbol)) +
      '<div class="row-main">' +
      '<div class="row-t"><span class="nm">' + U.esc(e.name) + '</span>' +
      (e.isImplemented ? '' : '<span class="pill gray">预案</span>') +
      '</div>' +
      '<div class="row-s">' + U.esc(XJ.market.displayCode(e.symbol)) + ' · ' +
      '<span style="color:' + m.color + ';font-weight:600">' + U.esc(m.label) + '</span> · ' + sub + '</div>' +
      '</div>' +
      '<div class="row-right">' + right +
      '<div class="row-v2">' + U.esc(e.reportDate.slice(0, 7)) + ' ' + U.esc(e.reportType) + '</div>' +
      '</div>' +
      '<span class="chev">' + UI.icon('chevron', 16) + '</span>' +
      '</button>';
  }

  function monthGrid(mv, selDate) {
    var first = new Date(mv.year, mv.month - 1, 1);
    var startPad = first.getDay();
    var daysInMonth = new Date(mv.year, mv.month, 0).getDate();
    var prevDays = new Date(mv.year, mv.month - 1, 0).getDate();
    var today = U.today();

    var cells = '';
    for (var i = startPad - 1; i >= 0; i--) cells += '<div class="cal-cell other">' + (prevDays - i) + '</div>';
    for (var d = 1; d <= daysInMonth; d++) {
      var ds = mv.year + '-' + U.pad2(mv.month) + '-' + U.pad2(d);
      var evs = mv.byDate[ds] || [];
      var types = {};
      evs.forEach(function (e) { types[e.type] = true; });
      var cls = 'cal-cell';
      if (ds === today) cls += ' today';
      else if (evs.length) cls += ' has';
      if (selDate === ds && ds !== today) cls += ' sel';
      var dots = ['register', 'exdiv', 'payout'].filter(function (t) { return types[t]; })
        .map(function (t) { return '<span class="cal-dot ' + t + '"></span>'; }).join('');
      cells += '<div class="' + cls + '"' + (evs.length ? ' data-act="selDate" data-date="' + ds + '"' : '') + '>' +
        '<span>' + d + '</span>' +
        (dots ? '<span class="cal-dots">' + dots + '</span>' : '<span class="cal-dots"></span>') +
        '</div>';
    }
    var total = startPad + daysInMonth;
    var tail = (7 - (total % 7)) % 7;
    for (var t = 1; t <= tail; t++) cells += '<div class="cal-cell other">' + t + '</div>';
    return cells;
  }

  function renderCalendar(st, acc) {
    var y = st.ui.calYear, m = st.ui.calMonth;
    var mv = XJ.calc.monthView(st.state, acc, y, m);
    var pend = XJ.calc.pendingExDiv(st.state, acc);
    var html = '';

    /* 待除权：已公布分红方案、等待除权日（息记同款卡片） */
    if (pend.count > 0) {
      html += pendingCard(st, pend);
    } else if (mv.receivedTotal > 0) {
      html += '<div class="cal-banner" style="background:var(--payout-banner-grad);border-color:var(--payout-banner-line);color:var(--payout-banner-fg)">' +
        '本月已到账分红 <b style="color:var(--down)">' + U.moneySign(mv.receivedTotal) + '</b>，当前没有等待除权的方案。</div>';
    } else {
      html += '<div class="cal-banner" style="background:var(--card-2);border-color:var(--line);color:var(--text-2)">' +
        '当前没有等待除权的分红方案。</div>';
    }

    /* 月历（平板横屏时与右侧事件区并排，见 style.css 的 .cal-split） */
    html += '<div class="cal-split">';
    html += '<div class="card">' +
      '<div class="cal-head">' +
      '<button class="icon-btn" data-act="calPrev">' + UI.icon('chevron', 16) + '</button>' +
      '<div class="ym">' + y + ' 年 ' + m + ' 月</div>' +
      '<button class="icon-btn" data-act="calNext">' + UI.icon('chevron', 16) + '</button>' +
      '</div>' +
      '<div style="text-align:center;margin:-6px 0 10px"><button class="tiny" style="color:var(--blue);font-weight:600" data-act="calToday">点击回今天</button></div>' +
      '<div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>' +
      '<div class="cal-grid">' + monthGrid(mv, st.ui.selDate) + '</div>' +
      '<div class="cal-legend">' +
      '<span><i style="background:var(--blue)"></i>股权登记</span>' +
      '<span><i style="background:var(--up)"></i>除权除息</span>' +
      '<span><i style="background:var(--payout)"></i>派息日</span>' +
      '</div>' +
      '<div class="note-line" style="justify-content:center;margin-top:12px">' +
      UI.icon('info', 13) +
      '<span>分红数据已更新至上一个交易日，新披露的方案次日排入日历；A 股口径为「派息日 = 除权除息日」（数据源无独立派息日字段），基金与港股为数据源给出的真实发放日</span>' +
      '</div>' +
      '</div>';

    /* 当日 / 当月事件（右侧一列，与左侧月历并排，见 .cal-split） */
    html += '<div class="cal-col">';
    var sel = st.ui.selDate;
    var listEvents = sel ? (mv.byDate[sel] || []) : mv.events;
    var title = sel ? (sel + ' · ' + listEvents.length + ' 个事件') : ('本月全部事件 · ' + mv.events.length);

    html += '<div class="section-title" style="display:flex;align-items:center"><span>' + U.esc(title) + '</span>' +
      '<span style="flex:1"></span>' +
      (sel ? '<button class="tiny" style="color:var(--blue);font-weight:600" data-act="selDate" data-date="">显示全月</button>' : '') +
      '</div>';

    if (!listEvents.length) {
      html += '<div class="card"><div class="tiny" style="text-align:center;padding:14px 0">' +
        (sel ? '这一天没有分红安排。' : '本月没有分红安排。') + '</div></div>';
    } else {
      html += '<div class="list">' + listEvents.map(eventLine).join('') + '</div>';
    }
    html += '</div>';                 // 收 .cal-col
    html += '</div>';                 // 收 .cal-split
    return html;
  }

  /* ---------------- 年度总览 ---------------- */
  function renderAnnual(st, acc) {
    var years = XJ.calc.availableYears(st.state, acc);
    var year = st.ui.annualYear || years[0] || U.yearOf(U.today());
    var av = XJ.calc.annualView(st.state, acc, year);
    var max = Math.max.apply(null, av.months.concat([1]));
    var curMonth = U.monthOf(U.today());
    var isCurYear = year === U.yearOf(U.today());

    /* 默认选中月：优先当月（有数据时），否则取最近有数据的月份，再否则取当月 */
    var selMonth = st.ui.annualMonth;
    if (!selMonth) {
      if (isCurYear && av.months[curMonth - 1] > 0) selMonth = curMonth;
      else {
        for (var i = 12; i >= 1; i--) { if (av.months[i - 1] > 0) { selMonth = i; break; } }
        if (!selMonth) selMonth = isCurYear ? curMonth : 12;
      }
    }

    var html = '';

    /* 年份切换 */
    html += '<div class="cal-head">' +
      '<button class="icon-btn" data-act="annualPrev">' + UI.icon('chevron', 16) + '</button>' +
      '<div class="ym">' + year + ' 年</div>' +
      '<button class="icon-btn" data-act="annualNext">' + UI.icon('chevron', 16) + '</button>' +
      '</div>' +
      '<div style="text-align:center;margin:-6px 0 12px"><span class="tiny">年度分红总览</span></div>';

    /* 大数字 */
    html += '<div class="card" style="background:var(--slogan-grad);border:1px solid var(--warn-line)">' +
      '<div style="font-size:12px;color:var(--warn-fg)">年度已到账分红</div>' +
      '<div style="font-size:34px;font-weight:750;letter-spacing:-1.2px;color:var(--dividend);margin-top:4px">' +
      U.moneySign(av.total) + '</div>' +
      '<div class="tiny" style="margin-top:6px">共 ' + U.cn(av.count) + ' 笔，来自 ' + av.symbolCount + ' 只持仓</div>' +
      '</div>';

    /* 柱状图 */
    html += '<div class="card">' +
      '<div class="bars">' + av.months.map(function (v, i) {
        var mo = i + 1;
        var pct = max > 0 ? Math.max(0, v / max * 100) : 0;
        var cls = 'bar-col' + (v <= 0 ? ' zero' : '') + (mo === selMonth ? ' sel' : '');
        return '<button class="' + cls + '" data-act="selAnnualMonth" data-m="' + mo + '" style="background:none;padding:0">' +
          (mo === selMonth && v > 0 ? '<span class="amt">' + U.moneySign(v, 0) + '</span>' : '') +
          '<span class="barv" style="height:' + (v > 0 ? Math.max(6, pct) : 0) + '%"></span>' +
          '<span class="mm">' + mo + '</span>' +
          '</button>';
      }).join('') + '</div>' +
      '<div class="bar-legend">' +
      '<span><i style="background:var(--dividend-mid)"></i>已到账</span>' +
      '<span><i style="background:var(--fill)"></i>暂无记录</span>' +
      '<span><i style="background:var(--dividend)"></i>选中月</span>' +
      '</div>' +
      '</div>';

    /* 月度明细 */
    var monthRecords = av.records.filter(function (r) { return U.monthOf(r.exDividendDate) === selMonth; });
    var monthTotal = U.sum(monthRecords, function (r) { return r.amount; });
    html += '<div class="section-title" style="display:flex;align-items:center">' +
      '<span>' + selMonth + '月到账明细</span><span style="flex:1"></span>' +
      '<span class="c-div" style="font-weight:700">' + U.moneySign(monthTotal) + '</span></div>';

    if (!monthRecords.length) {
      html += '<div class="card"><div class="tiny" style="text-align:center;padding:14px 0">该月没有到账记录。</div></div>';
    } else {
      html += '<div class="list">' + monthRecords.map(function (r) {
        return '<button class="list-row" data-act="openSymbol" data-symbol="' + U.esc(r.symbol) + '">' +
          UI.avatar(XJ.store.symbolName(r.symbol), r.symbol, 38, C.logoFor(r.symbol)) +
          '<div class="row-main">' +
          '<div class="row-t"><span class="nm">' + U.esc(XJ.store.symbolName(r.symbol)) + '</span></div>' +
          '<div class="row-s">' + U.esc(XJ.market.displayCode(r.symbol)) + ' · ' +
          U.esc(r.exDividendDate) + ' 到账 · ' + U.thousands(r.qtyAtRecord) + ' 股 × ' +
          U.money(r.perShareAmount, 4) + '</div>' +
          '</div>' +
          '<div class="row-right"><div class="row-v c-div">' + U.moneySign(r.amount) + '</div></div>' +
          '<span class="chev">' + UI.icon('chevron', 16) + '</span>' +
          '</button>';
      }).join('') + '</div>';
    }

    /* 月均 */
    html += '<div class="card" style="margin-top:12px;background:var(--slogan-grad)">' +
      '<div class="tiny" style="color:var(--warn-fg)">平均每月到账，持仓在默默为你工作 🌱</div>' +
      '<div style="font-size:18px;font-weight:700;color:var(--dividend);margin-top:4px">' +
      U.moneySign(av.monthlyAvg) + '<span class="tiny" style="color:var(--pend-text);font-weight:400;margin-left:6px">/月</span></div>' +
      '<div class="tiny" style="margin-top:4px">' +
      (isCurYear ? '按已过去的 ' + av.denom + ' 个月平均' : '按 12 个月平均') + '</div>' +
      '</div>';

    return html;
  }

  function render() {
    var st = XJ.store;
    var acc = st.acc();
    var html = '';
    html += C.statusBanner();
    html += C.accountSwitcher();

    if (!st.hasAnyData()) {
      html += UI.emptyState('📅', '暂无分红日历',
        '添加持仓并同步分红方案后，这里会显示每只标的的股权登记日、除权除息日与派息日。',
        '<button class="ghost-btn primary" data-act="openAddHolding">添加持仓</button>');
      return html;
    }

    html += segSwitch(st);
    html += (st.ui.calView === 'annual') ? renderAnnual(st, acc) : renderCalendar(st, acc);
    return html;
  }

  return { render: render, TYPE_META: TYPE_META };
})();


/* ==================== src/views/plan.js ==================== */
/* ==================== 视图：FIRE（被动收入 · 财务自由试算） ====================
 * 卡片顺序：大数字 → 试算滑杆 → FI 进度（图3） → 覆盖率曲线（图2） → 场景（图4）
 *           → 支出分组（生存/品质） → 分红汇总入口。
 * 计算全部来自 calc.js 的 FIRE section（verify【37】与 tools/test-fire.mjs 锁口径），
 * 视图内不做任何内联计算 —— 每个数字都能在断言里找到来源。
 */
XJ.views.plan = (function () {
  var U = XJ.util, UI = XJ.ui, C = XJ.views.common, X = XJ.calc;

  function tierKey(fire) {
    return fire && (fire.activeTier === 'lean' || fire.activeTier === 'fat') ? fire.activeTier : 'regular';
  }
  function tierName(t) { return t === 'lean' ? 'Lean FIRE' : t === 'fat' ? 'Fat FIRE' : 'Regular FIRE'; }
  function tierTag(t) { return t === 'lean' ? '生存线自由' : t === 'fat' ? '富足自由（生存 + 200% 品质）' : '当前生活方式自由'; }

  function monthsText(months) {
    if (months === null || months === undefined) return '—';
    if (months <= 0) return '已达成';
    var y = Math.floor(months / 12);
    var m = Math.round(months - y * 12);
    if (m === 12) { y += 1; m = 0; }
    if (y <= 0) return m + ' 个月';
    if (m <= 0) return y + ' 年';
    return y + ' 年 ' + m + ' 个月';
  }

  /* ---------------- 滑杆 ---------------- */
  function sliderHtml(k, label, min, max, step, val, valText, headExtra) {
    var p = (val - min) / (max - min) * 100;
    return '<div class="fire-slider">' +
      '<div class="fs-head"><label>' + label + '</label>' + (headExtra || '') +
      '<span class="fs-val" id="fs-val-' + k + '">' + valText + '</span></div>' +
      '<input type="range" class="fs-range" min="' + min + '" max="' + max + '" step="' + step +
      '" value="' + val + '" style="--p:' + p + '%"' +
      ' data-input="fireSliderInput" data-change="fireSliderCommit" data-k="' + k + '" aria-label="' + label + '">' +
      '<div class="fs-ticks">' + ticksFor(k) + '</div>' +
      '</div>';
  }
  function ticksFor(k) {
    if (k === 'dripYieldPct') return '<span>0%</span><span>10%</span><span>20%</span><span>30%</span>';
    if (k === 'reinvest') return '<span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>';
    if (k === 'drip') return '<span>0</span><span>1万</span><span>2万</span><span>3万</span><span>4万</span><span>5万</span>';
    return '<span>0</span><span>1万</span><span>2万</span><span>3万</span>';
  }

  /* ---------------- 卡 1：大数字（具体年月 + 档位切换 chips） ---------------- */
  function tierChipsHtml(tier) {
    return ['lean', 'regular', 'fat'].map(function (t) {
      return '<button type="button" class="chip' + (t === tier ? ' active' : '') +
        '" data-act="setFireTier" data-v="' + t + '">' + tierName(t).replace(' FIRE', '') + '</button>';
    }).join('');
  }

  function bigCardHtml(fire, tier, tl) {
    var title = '距离财务自由';
    var big, sub;
    if (!tl.solvable) {
      big = '—';
      sub = tl.reason === 'beyond-limit'
        ? '按当前参数 50 年内无法达成'
        : '投入与息率不足以增长——请调高攒股金额或息率';
    } else if (tl.reached) {
      big = '已达成';
      sub = '🎉 当前被动收入已覆盖目标支出';
    } else {
      var ym = tl.date || U.ymOf(U.today());
      big = Number(ym.slice(0, 4)) + ' 年 ' + Number(ym.slice(5, 7)) + ' 月';
      sub = '距今日 ' + monthsText(tl.months);
    }
    return '<div class="card fire-hero fi-glass">' +
      '<div class="fire-hero-row"><span class="fire-hero-title">' + title + '</span>' +
      '<span class="fs-mini-seg fi-glass" role="group">' + tierChipsHtml(tier) + '</span></div>' +
      '<div class="fire-big" id="fire-big-num">' + big + '</div>' +
      '<div class="fire-sub" id="fire-big-sub">' + sub + '</div>' +
      '<div class="fire-hero-note">被动收入 = 现有持仓分红 + 每月攒股按息率滚出的分红（再投 ' +
      U.n0(fire.reinvestPct) + '%，可在下方试算卡调节）</div>' +
      '</div>';
  }

  /* ---------------- 卡 2：试算滑杆（四根：花费/攒股/息率/再投） ---------------- */
  function sliderCardHtml(st, fire, tier, cfg, targets) {
    var spendMode = st.ui.fireSpendMode === 'day' ? 'day' : 'month';
    var spendVal = spendMode === 'day'
      ? '¥' + (cfg.monthlySpend / X.FIRE.daysPerMonth).toFixed(2) + '/日'
      : U.moneySign(cfg.monthlySpend, 0);
    var spendLabel = spendMode === 'day' ? '每日消费' : '每月花费';
    var spendSwitch =
      '<span class="segmented fs-mini fi-glass" role="group">' +
      '<button type="button" class="' + (spendMode === 'day' ? 'on' : '') + '" data-act="fireSpendMode" data-v="day">日</button>' +
      '<button type="button" class="' + (spendMode === 'month' ? 'on' : '') + '" data-act="fireSpendMode" data-v="month">月</button>' +
      '</span>';

    /* 提示行：相对全默认基准的 Δ + 按市值息率折算的生息资产（随行情自动更新） */
    var sim = fire.tierSims[tier] || {};
    var touched = sim.monthlySpend !== null || (sim.drip !== null && sim.drip !== 5000) || sim.dripYieldPct !== null;
    var tip;
    if (touched) {
      var cleanFire = { yieldBasis: 'market', reinvestPct: fire.reinvestPct, tierSims: { lean: {}, regular: {}, fat: {} } };
      var baseTl = X.fireTimeline(st.state, st.acc(), X.fireCfg(st.state, st.acc(), tier, cleanFire));
      var cur = X.fireTimeline(st.state, st.acc(), cfg);
      if (cur.solvable && !cur.reached && baseTl.solvable && !baseTl.reached) {
        var d = baseTl.months - cur.months;          // 正 = 提前
        tip = '<div class="fire-tip ' + (d >= 0 ? 'good' : 'warn') + '" id="fire-tip-line">' +
          (d >= 0 ? '自由日提前 ' : '自由日推后 ') + monthsText(Math.abs(d)) + '</div>';
      } else if (cur.reached) {
        tip = '<div class="fire-tip good" id="fire-tip-line">🎉 按当前滑杆参数，被动收入已可覆盖目标支出</div>';
      } else {
        tip = '<div class="fire-tip" id="fire-tip-line">按当前参数' + (cur.solvable ? '' : '暂无法测算（息率与投入不足以增长）') + '</div>';
      }
    } else {
      tip = '<div class="fire-tip" id="fire-tip-line">拖动滑杆试试「少花一点 / 多攒一点」对自由日的影响</div>';
    }
    var tierTarget = targets.tiers[tier];
    var capText = tierTarget.fireNumber === null
      ? '暂无法测算'
      : U.moneySign(tierTarget.fireNumber, 0) + '（按当前市值息率 ' + U.pct(targets.yieldPct === null ? 0 : targets.yieldPct, 2) + ' 折算）';

    return '<div class="card fi-glass">' +
      '<div class="card-head"><h2>⚖ 试算</h2><span class="spacer"></span>' +
      '<button class="chip" data-act="fireReset">重置</button></div>' +
      sliderHtml('monthlySpend', spendLabel, 0, X.FIRE.spendMax, X.FIRE.spendStep, cfg.monthlySpend, spendVal, spendSwitch) +
      sliderHtml('drip', '每月攒股', 0, X.FIRE.dripMax, X.FIRE.dripStep, cfg.drip, U.moneySign(cfg.drip, 0)) +
      sliderHtml('dripYieldPct', '攒股息率（市值口径）', 0, 30, 0.1, cfg.dripYieldPct, U.pct(cfg.dripYieldPct, 1)) +
      sliderHtml('reinvest', '分红再投', 0, 100, 10, U.n0(fire.reinvestPct), U.pct(U.n0(fire.reinvestPct), 0)) +
      tip +
      '<div class="tiny" style="margin-top:8px">完全覆盖约需 ' + capText +
      ' 生息资产，随行情刷新自动更新。息率默认跟随当前组合（' +
      U.pct(targets.yieldPct === null ? 0 : targets.yieldPct, 2) + '），拖动后固定。</div>' +
      '</div>';
  }

  /* 当日分时市值：薄封装 networth 已验证的链路（holdings → minuteCache → alignMinute）。
     返回 [{date:'HH:MM', pct:mv}]；无分时数据返回 []。 */
  function buildIntradayMv(st) {
    var hs = X.holdings(st.state, st.acc());
    if (!hs.length) return [];
    var syms = hs.map(function (h) { return h.symbol; });
    var minMap = st.intradayFor ? st.intradayFor(syms) : {};
    if (!minMap || !Object.keys(minMap).length) return [];
    var fx = (st.state.settings && st.state.settings.fx) || {};
    var rateFn = function (sym) { return fx[XJ.market.currency(sym)] || 1; };
    var prevMap = {};
    hs.forEach(function (h) {
      var pc = U.num(h.prevClose);
      if (pc === null || pc <= 0) pc = U.num(h.price);
      if (pc !== null && pc > 0) prevMap[h.symbol] = pc;
    });
    var al = X.alignMinute(hs, minMap, rateFn, { full: true, prev: prevMap });
    return (al && al.points || []).map(function (p) {
      return { date: p.t, pct: p.mv };
    });
  }

  /* 时间尺度 chips 行 */
  function rangeChipsHtml(current, ranges, act) {
    var LABELS = { today: '当日', '1m': '本月', '3m': '近三月', '6m': '近半年', ytd: '今年以来', all: '全部', custom: '自定义' };
    return ranges.map(function (r) {
      return '<button type="button" class="chip' + (r === current ? ' active' : '') +
        '" data-act="' + act + '" data-v="' + r + '">' + LABELS[r] + '</button>';
    }).join('');
  }

  function ymAddLocal(ym, n) {
    var y = parseInt(String(ym).slice(0, 4), 10);
    var m = parseInt(String(ym).slice(5, 7), 10) - 1 + n;
    y += Math.floor(m / 12);
    m = ((m % 12) + 12) % 12;
    return y + '-' + String(m + 1).padStart(2, '0');
  }

  /* 按尺度切片（月序列按月粒度对齐；日序列走 chartRange） */
  function slicePoints(points, range, beg, end, isMonthly) {
    if (range === 'all') return points;
    if (isMonthly) {
      var curYm = U.ymOf(U.today());
      var startYm = null;
      if (range === 'custom') startYm = beg || null;
      else if (range === '3m') startYm = ymAddLocal(curYm, -2);
      else if (range === '6m') startYm = ymAddLocal(curYm, -5);
      else if (range === 'ytd') startYm = curYm.slice(0, 4) + '-01';
      if (!startYm) return points;
      return points.filter(function (p) { return p.date >= startYm; });
    }
    var r = X.chartRange(range === 'today' ? 'all' : range, U.today(), beg, end);
    return points.filter(function (p) { return (!r.beg || p.date >= r.beg) && (!r.end || p.date <= r.end); });
  }

  /* ---------------- 卡 3：FI 进度（图 3，七档时间尺度） ---------------- */
  function progressCardHtml(st, fire, tier, targets) {
    var pr = X.fireProgress(st.state, st.acc(), 'market');
    var bars = ['lean', 'regular', 'fat'].map(function (t) {
      var d = pr.tiers[t];
      var pct = d.ratio === null ? 0 : Math.min(100, Math.max(0, d.ratio));
      var active = t === tier;
      return '<div class="fi-row' + (active ? ' active' : '') + '">' +
        '<div class="fi-row-t"><b>' + tierName(t) + '</b><span class="fi-goal">' +
        (d.fireNumber === null ? '暂无法测算' : tierTag(t) + ' · ' + U.moneyCompact(d.fireNumber)) + '</span>' +
        '<span class="fi-pct">' + (d.ratio === null ? '—' : U.pct(d.ratio, 1)) + '</span></div>' +
        '<div class="bar"><i style="width:' + pct + '%' + (active ? ';background:var(--dividend)' : '') + '"></i></div>' +
        '</div>';
    }).join('');

    var range = st.ui.firePrRange || 'all';
    var chartHtml = '';
    var chartNote = '';
    if (range === 'today') {
      var pts = buildIntradayMv(st);
      if (pts.length > 1) {
        chartHtml = XJ.chart.renderCompare(
          [{ name: 'FI 本金（当日）', color: '#3FA9C9', points: pts }],
          { unit: 'money', fmtY: function (v) { return U.moneyAxis(v); }, xTicks: 4, area: true, chartKey: 'firePr' });
      } else {
        chartNote = '<div class="tiny" style="padding:8px 0">当日分时数据暂缺（收盘后或新装设备），切到其他时间尺度查看历史。</div>';
      }
    } else if (pr.series.length > 1) {
      var sliced = slicePoints(pr.series, range, st.ui.firePrBeg, st.ui.firePrEnd, false);
      if (sliced.length > 1) {
        chartHtml = XJ.chart.renderCompare(
          [{ name: 'FI 本金', color: '#3FA9C9', points: sliced.map(function (p) { return { date: p.date, pct: p.mv }; }) }],
          { unit: 'money', fmtY: function (v) { return U.moneyAxis(v); }, xTicks: 4, area: true, chartKey: 'firePr' });
      } else {
        chartNote = '<div class="tiny" style="padding:8px 0">该区间内数据不足，换一个更宽的时间尺度试试。</div>';
      }
    } else {
      chartNote = '<div class="tiny" style="padding:8px 0">正在获取历史行情，资产曲线稍后自动出现。</div>';
    }
    var chips = rangeChipsHtml(range, ['today', '1m', '3m', '6m', 'ytd', 'all', 'custom'], 'setFirePrRange');

    /* 小字补全（⑧）：缺口 + 市值息率下的每月新增分红 + 线性推算年月（精确到月） */
    var d0 = pr.tiers[tier];
    var sim = st.state.settings.fire.tierSims[tier] || {};
    var drip = sim.drip === null ? 5000 : sim.drip;
    var yPct = targets.yieldPct;
    var note;
    if (d0.fireNumber === null) {
      note = '组合市值息率暂无法计算（成本非正或无持仓），FI 进度待行情刷新后自动恢复（随行情自动更新）。';
    } else if (d0.gap <= 0) {
      note = '🎉 已越过 ' + tierName(tier) + ' 的本金门槛（' + U.moneyCompact(d0.fireNumber) + '）。';
    } else {
      var newDivM = drip * (yPct === null ? 0 : yPct) / 1200;      // 每月攒股新增月分红
      var monthsNeed = drip > 0 ? Math.ceil(d0.gap / drip) : null; // 线性：本金缺口 ÷ 每月攒股
      var needTxt = monthsNeed ? (Math.floor(monthsNeed / 12) + ' 年 ' + (monthsNeed % 12) + ' 个月') : '—';
      note = '距 ' + tierName(tier) + ' 还差 ' + U.moneyCompact(d0.gap) +
        '；按市值息率 ' + U.pct(yPct === null ? 0 : yPct, 2) + '，每月攒股 ' + U.moneySign(drip, 0) +
        ' 可新增月分红 ' + U.moneySign(newDivM, 2) + '，按此推算预计还需 ' + needTxt +
        '（不计价差与收益变化，随行情刷新自动更新）。';
    }
    return '<div class="card fi-glass">' +
      '<div class="card-head"><h2>◎ FI 进度</h2><span class="spacer"></span>' +
      '<span class="fi-principal">FI 本金 <b>' + U.moneyCompact(pr.fiPrincipal) + '</b></span></div>' +
      bars +
      '<div class="fs-mini-seg fi-range-row fi-glass">' + chips + '</div>' +
      (chartHtml ? '<div class="fi-chart">' + chartHtml + '</div>' : chartNote) +
      '<div class="fire-note">' + note + '</div>' +
      (pr.missing && pr.missing.length ? '<div class="tiny" style="margin-top:6px">' + pr.missing.length + ' 只标的暂无历史行情，未计入曲线。</div>' : '') +
      '</div>';
  }

  /* ---------------- 卡 4：覆盖率曲线（图 2，五档时间尺度 + 年均大数字） ---------------- */
  function coverageCardHtml(st, fire, tier, cfg, targets) {
    var cov = X.fireCoverageHistory(st.state, st.acc(), tier, cfg);
    var chips = ['lean', 'regular', 'fat'].map(function (t) {
      return '<button type="button" class="chip' + (t === tier ? ' active' : '') +
        '" data-act="setFireTier" data-v="' + t + '">' + tierName(t).replace(' FIRE', '') + '</button>';
    }).join('');

    /* 大数字 = 近 12 个月平均覆盖率（当前月没分红时不再误导为 0%） */
    var hist = cov.history.filter(function (p) { return p.pct !== null; });
    var recent = hist.slice(-12);
    var avgPct = recent.length
      ? U.sum(recent, function (p) { return p.pct; }) / recent.length
      : (cov.future.length ? cov.future[0].pct : null);
    var head = '<div class="cov-head"><span class="cov-num">' + (avgPct === null ? '—' : U.pct(avgPct, 1)) + '</span>' +
      '<span class="cov-hint">近 12 个月平均 · 达到 100% 即 ' + tierName(tier) + ' 达成</span></div>';

    var range = st.ui.fireCovRange || 'all';
    var histPts = slicePoints(hist, range, st.ui.fireCovBeg, st.ui.fireCovEnd, true);
    var points = histPts.concat(cov.future).filter(function (p) { return p.pct !== null; });
    var chartSvg = '';
    if (points.length > 1) {
      chartSvg = XJ.chart.renderCompare(
        [{ name: '被动收入覆盖率', color: '#007AFF', points: points }],
        { unit: '%', fmtY: function (v) { return v.toFixed(0) + '%'; }, xTicks: 4,
          area: true, hline: { value: 100, color: 'var(--payout)', label: '100% 🎉' }, chartKey: 'fireCov' });
    } else {
      chartHtml = '<div class="tiny" style="padding:8px 0">到账记录不足，暂无法画覆盖率曲线（有分红到账后自动出现）。</div>';
    }
    var covChips = rangeChipsHtml(range, ['3m', '6m', 'ytd', 'all', 'custom'], 'setFireCovRange');

    /* 小字（⑩）：缺口 + 攒股新增月分红 + 市值息率折算（非 4% 法则） */
    var passiveNow = X.fireMonthlyPassive(cfg, 0);
    var gapM = Math.max(0, cfg.monthlySpend - passiveNow);
    var tierTarget = targets.tiers[tier];
    var sim = fire.tierSims[tier] || {};
    var drip = sim.drip === null ? 5000 : sim.drip;
    var yPct = targets.yieldPct;
    var newDivM = drip * (yPct === null ? 0 : yPct) / 1200;
    var note = '月均被动收入 ' + U.moneySign(passiveNow, 2) + '，目标月支出 ' + U.moneySign(cfg.monthlySpend, 2) +
      (gapM > 0 ? '——每月再补 ' + U.moneySign(gapM, 2) + ' 被动现金流即可完全覆盖' : '——已完全覆盖 🎉') +
      '；每月攒股 ' + U.moneySign(drip, 0) + ' 按市值息率新增月分红 ' + U.moneySign(newDivM, 2) +
      (tierTarget && tierTarget.fireNumber !== null
        ? '，完全覆盖约需 ' + U.moneyCompact(tierTarget.fireNumber) + ' 生息资产（按市值息率折算，随行情自动更新）'
        : '') + '。';

    return '<div class="card fi-glass">' +
      '<div class="card-head"><h2>◉ 被动收入覆盖率</h2><span class="spacer"></span><span class="fs-mini-seg">' + chips + '</span></div>' +
      head +
      '<div class="fs-mini-seg fi-range-row fi-glass">' + covChips + '</div>' +
      (chartSvg ? '<div class="cov-chart">' + chartSvg + '</div>' : '<div class="tiny" style="padding:8px 0">到账记录不足，暂无法画覆盖率曲线（有分红到账后自动出现）。</div>') +
      '<div class="fire-note">' + note + '</div>' +
      '</div>';
  }

  /* ---------------- 卡 5：支出分组（生存 / 品质） ---------------- */
  function expensesCardHtml(st) {
    function group(cat, title, hint) {
      var list = st.state.expenses.filter(function (e) {
        return e.enabled && (e.category === 'quality' ? 'quality' : 'essential') === cat;
      }).sort(function (a, b) { return a.sortOrder - b.sortOrder; });
      var total = U.sum(list, function (e) { return e.monthlyAmount; });
      var items = list.map(function (e) {
        return '<button class="exp-item" data-act="openExpenseEditor" data-key="' + U.esc(e.key) + '">' +
          '<div class="top">' + U.esc(e.icon || '🏷️') + '</div>' +
          '<div class="name">' + U.esc(e.label) + '</div>' +
          '<div class="amt">' + U.moneySign(e.monthlyAmount, 0) + '/月</div>' +
          '</button>';
      }).join('');
      return '<div class="exp-group">' +
        '<div class="exp-group-t"><b>' + title + '</b><span class="tiny">' + hint + ' · 合计 ' + U.moneySign(total, 0) + '/月</span></div>' +
        '<div class="exp-grid">' + (items || '<div class="tiny" style="grid-column:1/-1">暂无条目——点下方「编辑支出项」添加。</div>') + '</div>' +
        '</div>';
    }
    return '<div class="card">' +
      '<div class="card-head"><h2>🏠 支出分类</h2><span class="spacer"></span></div>' +
      group('essential', '生存支出', 'Lean FIRE 的分母') +
      group('quality', '品质支出', 'Regular / Fat FIRE 的分母') +
      '<button class="btn-block ghost" data-act="openExpenses">编辑支出项（金额批量调整 / 新增）</button>' +
      '</div>';
  }

  /* ---------------- 卡 7：分红汇总入口（原样保留） ---------------- */
  function entryCardHtml(st) {
    var dsum = XJ.calc.dividendSummary(st.state, st.acc(), { type: 'year' });
    return '<button class="card ds-entry" data-act="openDivSum">' +
      '<div><div class="card-head" style="margin:0"><h2>📊 分红汇总</h2></div>' +
      '<div class="row-s">今年已到账 ' + dsum.count + ' 笔' + (dsum.pendingTotal ? ' · 另有预计 ' + U.moneySign(dsum.pendingTotal, 0) : '') + '</div></div>' +
      '<div class="ds-entry-v">' + U.moneySign(dsum.total, 0) + '</div></button>';
  }

  /* ---------------- 主渲染 ---------------- */
  function render() {
    var st = XJ.store;
    var html = '';
    html += C.statusBanner();
    html += C.accountSwitcher();

    if (!st.hasAnyData()) {
      html += UI.emptyState('🔥', '还没有持仓数据', '先添加一笔持仓，FIRE 试算会基于你的预测分红自动开始。',
        '<button class="ghost-btn primary" data-act="openAddHolding">添加持仓</button>');
      return html;
    }

    var fire = st.state.settings.fire || {};
    var tier = tierKey(fire);
    var targets = X.fireTargets(st.state, st.acc(), 'market');
    var cfg = X.fireCfg(st.state, st.acc(), tier, fire);
    var tl = X.fireTimeline(st.state, st.acc(), cfg);

    html += bigCardHtml(fire, tier, tl);
    html += sliderCardHtml(st, fire, tier, cfg, targets);
    html += progressCardHtml(st, fire, tier, targets);
    html += coverageCardHtml(st, fire, tier, cfg, targets);
    html += expensesCardHtml(st);
    html += entryCardHtml(st);

    html += '<div class="note-line" style="margin-top:4px"><span class="ic">ℹ️</span><span>' +
      'FIRE 试算基于你自己的持仓分红与支出台账推演，只做记录与参考，不构成任何投资建议。</span></div>';
    return html;
  }

  return { render: render };
})();


/* ==================== src/views/divsummary.js ==================== */
/* ==================== 视图：分红汇总（独立子页面） ====================
 *
 * 取代了原先挂在「发现」页底部的「股息统计」区块 —— 内容搬到这里，并且多了：
 *   · 五个时间档位（今年 / 近2年 / 近5年 / 历史至今 / 自定义）
 *   · 「已到账」与「预计到账」分开列（预计绝不混进主数字）
 *   · 每只标的可展开的到账明细
 *
 * 口径全部来自 calc.dividendSummary（纯函数，verify.mjs 里有对应断言），
 * 视图层只负责排版，不自己算钱。
 */
XJ.views.divsummary = (function () {
  var U = XJ.util, UI = XJ.ui, C = XJ.views.common;

  /* ---------------- 时间档位 ---------------- */
  function chips(cur) {
    return '<div class="ds-ranges">' + XJ.calc.DIVSUM_RANGES.map(function (r) {
      return '<button class="chip' + (cur === r.key ? ' active' : '') +
        '" data-act="setDivsumRange" data-v="' + r.key + '">' + U.esc(r.label) + '</button>';
    }).join('') + '</div>';
  }

  function customRow(st) {
    if (st.ui.divsumRange !== 'custom') return '';
    return '<div class="ds-custom">' +
      '<input type="date" data-change="setDivsumBeg" aria-label="起始日期" value="' +
      U.esc(st.ui.divsumBeg || '') + '">' +
      '<span class="ds-custom-sep">至</span>' +
      '<input type="date" data-change="setDivsumEnd" aria-label="结束日期" value="' +
      U.esc(st.ui.divsumEnd || '') + '">' +
      '</div>';
  }

  /* ---------------- 主卡 ---------------- */
  function hero(sum, fun) {
    var n = XJ.calc.funEquivalent(sum.total, fun.monthly);
    return '<div class="card ds-hero">' +
      '<div class="ds-cap">分红总额</div>' +
      '<div class="ds-total">' + U.moneySign(sum.total) + '</div>' +
      '<div class="ds-rule"></div>' +
      '<div class="ds-kv"><span>到账笔数</span><span>' + sum.count + ' 笔</span></div>' +
      '<div class="ds-kv"><span>涉及标的</span><span>' + sum.bySymbolList.length + ' 只</span></div>' +
      (sum.pendingTotal > 0
        ? '<div class="ds-kv ds-pend"><span>另有预计到账</span><span>' +
          U.moneySign(sum.pendingTotal) + '</span></div>'
        : '') +
      (n !== null
        ? '<div class="ds-fun">这些分红相当于 ' + U.thousands(n) + ' 个月' +
          U.esc(fun.name) + ' 🎵</div>'
        : '') +
      '<div class="ds-quote">这些都是你的持仓为你赚来的被动收入 🫰</div>' +
      '</div>';
  }

  /* ---------------- 按标的（可展开到账明细） ---------------- */
  function symList(sum, st) {
    var open = st.ui.divsumOpen || '';
    return '<div class="section-title">按标的</div>' +
      sum.bySymbolList.map(function (g) {
        var isOpen = open === g.symbol;
        var rows = g.records.map(function (r) {
          var qty = U.n0(r.qtyAtRecord);
          return '<div class="ds-rec">' +
            '<span class="ds-rec-d">' + U.esc(String(r.exDividendDate || '').slice(5)) + '</span>' +
            '<span class="ds-rec-m">每股 ' + U.money(r.perShareAmount, 3) +
            ' × ' + U.thousands(qty) + ' 股</span>' +
            '<span class="ds-rec-a">' + U.moneySign(r.amount) + '</span>' +
            '</div>';
        }).join('');
        return '<div class="ds-sym' + (isOpen ? ' open' : '') + '">' +
          '<button class="ds-row" data-act="toggleDivsumSym" data-sym="' + U.esc(g.symbol) + '"' +
          ' aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
          '<span class="ds-code">' + U.esc(XJ.model.codeOf(g.symbol)) + '</span>' +
          '<span class="ds-name">' + U.esc(st.symbolName(g.symbol)) + '</span>' +
          '<span class="ds-sp"></span>' +
          '<span class="ds-amt">' + U.moneySign(g.amount) + '</span>' +
          '<span class="chev">' + UI.icon('chevron', 15, 2) + '</span>' +
          '</button>' +
          (isOpen ? '<div class="ds-detail">' + rows + '</div>' : '') +
          '</div>';
      }).join('');
  }

  /* ---------------- 按年（原「发现 · 股息统计」的年度汇总，搬到这里） ----------------
     区间跨 2 个自然年以上才有意义，单年区间不占版面。 */
  function yearBars(sum) {
    if (sum.years.length < 2) return '';
    var max = Math.max.apply(null, sum.years.map(function (y) { return sum.byYear[y]; }).concat([1]));
    return '<div class="section-title">按年</div><div class="card">' +
      sum.years.map(function (y) {
        var amt = sum.byYear[y];
        var w = Math.max(2, amt / max * 100);
        return '<div class="ds-year">' +
          '<div class="ds-year-top"><span>' + y + ' 年</span>' +
          '<span class="c-div ds-year-amt">' + U.moneySign(amt) + '</span></div>' +
          '<div class="bar"><i style="width:' + w.toFixed(1) + '%"></i></div>' +
          '</div>';
      }).join('') + '</div>';
  }

  /* ---------------- 主渲染 ---------------- */
  function render() {
    var st = XJ.store;
    var html = '';
    html += C.statusBanner();
    html += C.accountSwitcher();

    if (!st.hasAnyData()) {
      html += UI.emptyState('📒', '还没有数据',
        '先添加持仓。分红到账后系统会自动登记，这里就会汇总出来。',
        '<button class="ghost-btn primary" data-act="openAddHolding">添加持仓</button>');
      return html;
    }

    /* 档位校验：ui 里可能是旧值/脏值，一律退回「今年」 */
    var key = st.ui.divsumRange;
    var known = XJ.calc.DIVSUM_RANGES.some(function (r) { return r.key === key; });
    if (!known) key = 'year';

    var sum = XJ.calc.dividendSummary(st.state, st.acc(), {
      type: key, beg: st.ui.divsumBeg, end: st.ui.divsumEnd,
    });
    var fun = (st.state.settings && st.state.settings.dividendFun) || { name: '视频会员', monthly: 25 };

    html += '<div class="ds-head">分红汇总</div>';
    html += chips(key);
    html += customRow(st);

    if (!(sum.total > 0) && !(sum.pendingTotal > 0)) {
      html += UI.emptyState('🌾', '这个区间没有分红',
        '换一个时间档位看看，或者在「我的 · 分红流水」里补录一笔。');
      return html;
    }

    html += hero(sum, fun);

    if (sum.total > 0) {
      html += symList(sum, st);
      html += yearBars(sum);
    } else {
      html += '<div class="card"><div class="tiny" style="line-height:1.8">' +
        '这个区间还没有分红到账，另有 <b class="c-div">' + U.moneySign(sum.pendingTotal) +
        '</b> 预计到账（' + sum.pendingCount + ' 笔）。到账后会自动登记在这里。</div></div>';
    }

    html += '<div class="tiny ds-note">' +
      '口径：金额一律为<b>税前</b>；「分红总额」只统计<b>已到账</b>（与「我的 · 分红流水」逐笔一致），' +
      '未到账的部分单列在「另有预计到账」里，不混进总额。' +
      'A 股派息日按除权除息日推算，实际到账可能晚 1-2 天。' +
      '</div>';
    return html;
  }

  return { render: render };
})();

/* ==================== 视图：我的（数据管理 / 账户 / 设置） ==================== */
XJ.views.mine = (function () {
  var U = XJ.util, UI = XJ.ui;

  function renderAccounts() {
    var st = XJ.store;
    var list = st.accounts();
    var counts = {};
    st.state.transactions.forEach(function (t) {
      counts[t.accountId] = (counts[t.accountId] || 0) + 1;
    });

      '<div style="padding:14px 16px 10px"><div class="card-head" style="margin:0"><h2>账户管理</h2>' +
      '<div class="spacer"></div><span class="hint">' + list.length + ' 个</span></div></div>';
    html += list.map(function (a) {
      return '<button class="list-row" data-act="openAccountEditor" data-id="' + U.esc(a.accountId) + '">' +

        '<div class="row-t">' + U.esc(a.name) +
        (a.accountId === st.state.settings.defaultAccountId ? '<span class="pill blue">默认</span>' : '') +
        '</div>' +
        '<div class="row-s">' + U.esc({ BROKER: '券商账户', FAMILY: '家人账户', OTHER: '其他' }[a.type] || '其他') +
        ' · ' + (counts[a.accountId] || 0) + ' 笔交易</div>' +
        '</div>' +
        '<span class="chev">' + UI.icon('chevron', 16) + '</span>' +
        '</button>';
    }).join('');
    html += '</div>';
    html += '<div style="margin-top:10px"><button class="btn-block ghost" data-act="openAccountEditor">' +
      UI.icon('plus', 16) + ' 新建账户</button></div>';
    return html;
  }

  function renderTransactions() {
    var st = XJ.store;
    var folded = st.ui.foldMineTx !== false;      // 默认收起（最多 30 条，收起后页面清爽）
    var txs = st.state.transactions.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || '') < (a.createdAt || '') ? -1 : 1;
    }).slice(0, 30);

    var html = '<div class="card flush">' +
      '<div style="padding:14px 16px 10px">' +
      '<div class="card-head" style="margin:0">' +
      '<button class="fold-head" data-act="toggleFoldMineTx">' +
      '<h2>交易流水</h2>' +
      '<span class="hint">共 ' + st.state.transactions.length + ' 笔</span>' +
      '<span class="fold-caret' + (folded ? ' folded' : '') + '">' + UI.icon('chevron', 14) + '</span>' +
      '</button>' +
      '<div class="spacer"></div>' +
      '<button class="ghost-btn" data-act="openTxEditor">' + UI.icon('plus', 14) + ' 记一笔</button>' +
      '</div></div>';
    if (!txs.length) {
      html += '<div style="padding:0 16px 16px" class="tiny">暂无交易记录。持仓由交易流水推导，添加交易即可建立持仓。</div>';
    } else if (folded) {
      html += '<div class="fold-hint">已收起，最近 ' + txs.length + ' 笔 · 点标题展开查看</div>';
    } else {
      html += txs.map(function (t) {
        var isAdj = t.action === 'ADJUST';
        var amt = isAdj ? U.n0(t.amount) : U.n0(t.quantity) * U.n0(t.price);
        return '<button class="list-row" data-act="openTxEditor" data-id="' + U.esc(t.txId) + '">' +
          '<div class="row-main">' +
          '<div class="row-t">' + U.esc(st.symbolName(t.symbol)) +
          (isAdj
            ? '<span class="pill div">成本调整</span>'
            : '<span class="pill ' + (t.action === 'BUY' ? 'up' : 'down') + '">' + (t.action === 'BUY' ? '买入' : '卖出') + '</span>') +
          '</div>' +
          '<div class="row-s">' + U.esc(XJ.market.displayCode(t.symbol)) + ' · ' + U.esc(t.date) + ' · ' +
          U.esc(st.accountName(t.accountId)) +
          (isAdj ? '' : ' · ' + U.thousands(t.quantity) + '股 @ ' + U.money(t.price, 3)) + '</div>' +
          '</div>' +
          '<div class="row-right"><div class="row-v' + (isAdj ? ' ' + U.dirClass(amt) : '') + '">' + U.signMoney(amt) + '</div>' +
          (!isAdj && U.n0(t.fee) ? '<div class="row-v2">费 ' + U.money(t.fee) + '</div>' : '') +
          '</div>' +
          '<span class="chev">' + UI.icon('chevron', 16) + '</span>' +
          '</button>';
      }).join('');
    }
    html += '</div>';
    return html;
  }

  function renderExpenses() {
    var st = XJ.store;
    var list = st.state.expenses.slice().sort(function (a, b) { return a.sortOrder - b.sortOrder; });
    var total = U.sum(list.filter(function (e) { return e.enabled; }), function (e) { return U.n0(e.monthlyAmount) * 12; });

    var html = '<div class="card flush">' +
      '<div style="padding:14px 16px 10px"><div class="card-head" style="margin:0"><h2>息覆生活 · 支出项</h2>' +
      '<div class="spacer"></div><span class="hint">' + U.moneySign(total, 0) + '/年</span></div></div>';
    html += list.map(function (e) {
      return '<button class="list-row" data-act="openExpenseEditor" data-key="' + U.esc(e.key) + '">' +
        '<div class="row-main">' +
        '<div class="row-t">' + U.esc(e.label) +
        (e.enabled ? '' : '<span class="pill gray">已停用</span>') + '</div>' +
        '<div class="row-s">' + U.moneySign(e.monthlyAmount, 0) + '/月 · ' + U.moneySign(U.n0(e.monthlyAmount) * 12, 0) + '/年</div>' +
        '</div>' +
        '<span class="chev">' + UI.icon('chevron', 16) + '</span>' +
        '</button>';
    }).join('');
    html += '</div>';
    return html;
  }

  /* ---------------- 跨设备同步（精简面板） ----------------
   * 一张卡只回答四件事：开没开 / 上次同步怎么样 / 怎么配对 / 出错怎么自救。
   * 连接信息与详细日志收在折叠区里，需要时再展开。 */
  function renderSync() {
    var st = XJ.store;
    var SY = XJ.sync;
    if (!SY) return '';
    var s = SY.status();
    var available = false;
    try { available = (location.protocol === 'http:' || location.protocol === 'https:'); } catch (e) { available = false; }

    if (!available) {
      return '<div class="card flush sync-card">' +
        '<div style="padding:14px 16px 10px"><div class="card-head" style="margin:0"><h2>跨设备同步</h2></div></div>' +
        '<div class="list-row" style="pointer-events:none"><div class="row-main">' +
        '<div class="row-t">当前打开方式不支持同步</div>' +
        '<div class="row-s">双击本地 HTML 打开时浏览器无法联网同步。用网址（http/https）打开即可；本地功能不受影响。</div>' +
        '</div></div></div>';
    }

    var head = '<div class="card flush sync-card">' +
      '<div style="padding:14px 16px 10px"><div class="card-head" style="margin:0"><h2>跨设备同步</h2>' +
      '<label class="switch"><input type="checkbox" data-act="toggleSync"' + (s.enabled ? ' checked' : '') +
      '><span></span></label></div></div>';

    /* 状态一行：连没连上 / 上次同步 / 待推条数 */
    var main = s.paired ? '已连接 · 位置 ' + (s.boxFingerprint || '—') : '未配对';
    var sub = s.lastOkAt
      ? '上次同步 ' + fmtWhen(s.lastOkAt) + ' · 待推 ' + s.pending + ' 条'
      : (s.enabled ? '已开启，正在等待首次同步' : '打开开关并完成一次配对后生效');
    if (s.rateResetAt) sub = '触发 GitHub 限流，将于 ' + new Date(s.rateResetAt).toLocaleTimeString() + ' 后自动继续';

    var body = '<div class="list-row" style="pointer-events:none"><div class="row-main">' +
      '<div class="row-t">' + U.esc(main) + '</div>' +
      '<div class="row-s">' + U.esc(sub) + '</div></div></div>';

    /* 错误行：只在真的出错时出现，并把「该做什么」说清楚 */
    if (s.lastErr) {
      var mins = s.failSince ? Math.max(1, Math.round((Date.now() - s.failSince) / 60000)) : 0;
      body += '<div class="list-row sync-err" style="pointer-events:none"><div class="row-main">' +
        '<div class="row-t">' + U.esc(s.lastErr.msg) + '</div>' +
        '<div class="row-s">' + (mins > 1 ? '已连续失败 ' + mins + ' 分钟' : '本机数据完好无损') + '</div></div></div>';
    }

    /* 折叠区 1：连接信息（只读） */
    body += '<button class="fold-head" data-act="syncFoldConn">连接信息' +
      '<span class="fold-caret' + (st.ui.foldSyncConn ? '' : ' folded') + '"></span></button>';
    if (st.ui.foldSyncConn) {
      body += '<div class="sync-kv">' +
        kvLine('云端位置', s.gistId || '—') +
        kvLine('位置指纹', s.boxFingerprint || '—') +
        kvLine('云端版本', s.version ? ('第 ' + s.version + ' 版') : '—') +
        kvLine('本机设备', shortId(s.deviceId)) +
        kvLine('修订账本', s.ledger + ' 条记录' + (s.tombstones ? ' · 墓碑 ' + s.tombstones : '')) +
        kvLine('令牌权限', s.tokenScopes || '未知') +
        kvLine('存储方式', s.storageMode === 'idb' ? 'IndexedDB' : (s.storageMode === 'ls' ? '浏览器本地存储' : '不可用')) +
        '<div class="sync-btns">' +
        '<button class="btn-block ghost" data-act="syncNow">立即同步</button>' +
        '<button class="btn-block ghost" data-act="syncRepair">重新配对（粘贴口令）</button>' +
        (s.paired ? '<button class="btn-block ghost" data-act="syncCopyCode">复制配对口令</button>' : '') +
        '<button class="btn-block ghost" data-act="syncReset">重置连接</button>' +
        '</div>' +
        '<div class="tiny">配对口令等同云端钥匙，复制后 8 秒会自动清空剪贴板。' +
        '多台设备各点一次配对链接即可，之后自动保持一致。</div>' +
        '</div>';
    }

    /* 折叠区 2：详细日志（只在内存里，刷新即清） */
    var logs = SY.logAll ? SY.logAll() : [];
    body += '<button class="fold-head" data-act="syncFoldLog">详细日志' +
      '<span class="fold-caret' + (st.ui.foldSyncLog ? '' : ' folded') + '"></span></button>';
    if (st.ui.foldSyncLog) {
      body += '<div class="sync-log">' + (logs.length
        ? logs.slice().reverse().map(function (l) {
            return '<div class="sync-log-l"><span class="t">' + U.esc(String(l.ts).slice(11, 19)) +
              '</span><span class="k k-' + U.esc(l.kind) + '">' + U.esc(l.kind) + '</span>' +
              '<span class="x">' + U.esc(l.text) + '</span></div>';
          }).join('')
        : '<div class="tiny">本次打开页面后暂无记录</div>') + '</div>';
    }

    return head + body + '</div>';
  }
  function kvLine(k, v) {
    return '<div class="sync-kv-r"><span class="k">' + U.esc(k) + '</span><span class="v">' + U.esc(v) + '</span></div>';
  }
  function shortId(id) {
    if (!id) return '—';
    return String(id).length > 12 ? String(id).slice(0, 12) + '…' : String(id);
  }
  function fmtWhen(ts) {
    try {
      var d = new Date(ts);
      var today = new Date();
      var sameDay = d.toDateString() === today.toDateString();
      return (sameDay ? '今天 ' : (d.getMonth() + 1) + '/' + d.getDate() + ' ') +
        d.toTimeString().slice(0, 5);
    } catch (e) { return '—'; }
  }

  function renderData() {
    var st = XJ.store;
    var s = XJ.calc.summary(st.state, st.acc());
    var modeLabel = XJ.storage.modeLabel();
    var lastQuote = st.state.settings.lastQuoteAt;

    var html = '<div class="card flush">' +
      '<div style="padding:14px 16px 10px"><div class="card-head" style="margin:0"><h2>数据管理</h2></div></div>';

    html += '<button class="list-row" data-act="exportJson">' +
      '<div class="row-main"><div class="row-t">' + UI.icon('download', 17) + ' 导出全部数据（JSON）</div>' +
      '<div class="row-s">含账户、持仓、交易、分红方案与到账记录，可在其他设备导入</div></div>' +
      '<span class="chev">' + UI.icon('chevron', 16) + '</span></button>';

    html += '<button class="list-row" data-act="openTransfer">' +
      '<div class="row-main"><div class="row-t">📱 跨设备搬运（手机 / 平板）</div>' +
      '<div class="row-s">生成一段文本或链接，用微信/QQ 发到另一台设备打开即可导入，不经过任何服务器</div></div>' +
      '<span class="chev">' + UI.icon('chevron', 16) + '</span></button>';

    /* 同步卡片紧跟搬运入口：两者是「手动搬」与「自动同步」的关系 */
    html += renderSync();

    html += '<button class="list-row" data-act="importJson">' +
      '<div class="row-main"><div class="row-t">' + UI.icon('upload', 17) + ' 导入数据（JSON）</div>' +
      '<div class="row-s">从别的设备/浏览器迁移数据</div></div>' +
      '<span class="chev">' + UI.icon('chevron', 16) + '</span></button>';

XJ.views.analysis = (function () {
  var U = XJ.util, UI = XJ.ui, C = XJ.views.common;

  function render() {
    var st = XJ.store;
    var acc = st.acc();
    var an = XJ.calc.analytics(st.state, acc);
    var s = an.summary;
    var delta = XJ.calc.snapshotDelta(st.state);
    var lastQuote = st.state.settings.lastQuoteAt;
    var priceDate = lastQuote ? String(lastQuote).slice(5, 10).replace('-', '月') + '日' : '最近交易日';

    var html = '';

    /* ① 风险提醒（诚实前置） */
    html += '<div class="warn-card"><span class="ic">⚠️</span>' +
      '<span><b>风险提醒</b><br>本页数据基于你的持仓与最近交易日收盘价测算。行情来自公开渠道，可能存在瑕疵或延迟，' +
      '市值随行情波动，仅供参考，<b>不构成任何投资建议</b>。</span></div>';

    if (!s.count) {
      html += UI.emptyState('📊', '暂无持仓数据', '添加持仓并同步行情后，这里会显示账户的深度分析。',
        '<button class="ghost-btn primary" data-act="closeSubPage">返回</button>');
      return html;
    }

    /* ② 总资产（深色卡） */
    var unrealized = s.totalUnrealized;
    html += '<div class="hero-dark" style="margin-bottom:12px">' +
      '<div class="hd-status">当前总资产（基于 ' + U.esc(priceDate) + ' 价格）</div>' +
      '<div class="hd-amount"><span class="cur">¥</span>' + U.money(s.totalMarketValue) + '</div>' +
      (delta
        ? '<div class="hd-status" style="margin-top:6px">较上次记录 <b>' + U.signMoney(delta.mv, 0) + '</b>' +
        '<span style="opacity:.6"> · ' + U.esc(delta.prevDate) + '</span></div>'
        : '<div class="hd-status" style="margin-top:6px">还没有更早的快照，明天再来就能看到变化</div>') +
      '<div class="hd-metrics">' +
      '<div class="hd-metric"><div class="k">累计浮动盈亏</div><div class="v" style="color:' +
      (unrealized >= 0 ? '#FF8A73' : '#7BD8A6') + '">' + U.signMoney(unrealized, 0) + '</div></div>' +
      '<div class="hd-metric"><div class="k">浮盈比例</div><div class="v" style="color:' +
      (unrealized >= 0 ? '#FF8A73' : '#7BD8A6') + '">' + U.signPct(s.totalUnrealizedPct) + '</div></div>' +
      '<div class="hd-metric"><div class="k">持仓成本</div><div class="v">¥' + U.moneyCompact(s.totalCost) + '</div></div>' +
      '</div>' +
      '</div>';

    /* ③ 概览三列 */
    html += '<div class="metric-grid">' +
      '<div class="metric"><div class="k">持仓只数</div><div class="v">' + s.count + '</div><div class="s">只</div></div>' +
      '<div class="metric"><div class="k">单只平均市值</div><div class="v">¥' + U.moneyCompact(s.avgMarketValue) + '</div><div class="s">元</div></div>' +
      '<div class="metric"><div class="k">综合股息率</div><div class="v c-div">' +
      (s.marketYield === null ? '—' : U.pct(s.marketYield)) + '</div><div class="s">预测分红/市值</div></div>' +
      '</div>';

    /* ④ 资产走势（与首页同一张卡：持仓市值 / 净资产 / 收益率，区间/粒度/指数/收起齐全）
       控件状态用独立实例（ns='an'），不会与首页那张互相影响。
       它不依赖每日快照，直接由「交易流水还原持股数 × 历史收盘价」重建，所以新账户也能立刻看到曲线。 */
    html += XJ.views.networth.render('an');

    /* ⑤⑥ 一组：盈亏榜 + 股息率分层（平板横屏并排） */
    html += '<div class="an-split">';
    html += '<div class="an-col">';
    html += '<div class="section-title">持仓盈亏榜</div>';
    if (!an.byPnl.length) {
      html += '<div class="card"><div class="tiny" style="text-align:center;padding:14px 0">缺少行情时无法计算盈亏。</div></div>';
    } else {
      html += '<div class="list">' + an.byPnl.map(function (h) {
        return '<button class="list-row" data-act="openSymbol" data-symbol="' + U.esc(h.symbol) + '">' +
          UI.avatar(h.name, h.symbol, 38, C.logoOf(h)) +
          '<div class="row-main">' +
          '<div class="row-t"><span class="nm">' + U.esc(h.name) + '</span></div>' +
          '<div class="row-s">' + U.esc(XJ.market.displayCode(h.symbol)) + ' · 成本 ' + U.money(h.avgCost, 4) +
          ' · 现价 ' + (h.price === null ? '—' : U.money(h.price)) + '</div>' +
          '</div>' +
          '<div class="row-right">' +
          '<div class="row-v ' + U.dirClass(h.unrealizedCny) + '">' + U.signMoney(h.unrealizedCny, 0) + '</div>' +
          '<div class="row-v2 ' + U.dirClass(h.unrealizedPct) + '">' + U.signPct(h.unrealizedPct) + '</div>' +
          '</div>' +
          '<span class="chev">' + UI.icon('chevron', 16) + '</span>' +
          '</button>';
      }).join('') + '</div>';
      html += '<div class="tiny" style="margin:8px 2px 0">' + an.gainCount + ' 只浮盈 · ' + an.lossCount + ' 只浮亏</div>';
    }
    html += '</div>';                          // 收第 1 列 .an-col
    html += '<div class="an-col">';            // 第 2 列：股息率分层

    /* ⑥ 股息率分层（每个区间具体列出成分股） */
    html += '<div class="section-title">股息率分层</div>';
    var maxBucket = Math.max.apply(null, an.yieldBuckets.map(function (b) { return b.count; }).concat([1]));
    html += '<div class="card">' + an.yieldBuckets.map(function (b) {
      var w = Math.max(0, b.count / maxBucket * 100);
      var stocks = (b.stocks || []).length
        ? '<div class="sub-stocks">' + b.stocks.map(function (st) {
          return '<button class="sub-stock" data-act="openSymbol" data-symbol="' + U.esc(st.symbol) + '">' +
            U.esc(st.name) +
            '<b>' + (st.dividendYield === null ? '—' : U.pct(st.dividendYield, 2)) + '</b></button>';
        }).join('') + '</div>'
        : '<div class="sub-stocks"><span class="tiny" style="color:var(--text-3)">（无）</span></div>';
      return '<div style="margin-bottom:12px">' +
        '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px">' +
        '<span style="font-weight:600">' + U.esc(b.label) + '</span>' +
        '<span class="muted">' + b.count + ' 只 · ¥' + U.moneyCompact(b.marketValue) + '</span></div>' +
        '<div class="bar"><i style="width:' + w.toFixed(1) + '%"></i></div>' +
        stocks +
        '</div>';
    }).join('') + '</div>';

    html += '</div>';                          // 收第 2 列
    html += '</div>';                          // 收第 1 组 .an-split

    /* ⑦⑧ 一组：市场分布 + 集中度 */
    html += '<div class="an-split">';
    html += '<div class="an-col">';
    html += '<div class="section-title">市场分布（每个市场具体列出成分股）</div>';
    html += '<div class="card">' + (an.byAssetType.length ? an.byAssetType.map(function (g) {
      var pct = g.weight || 0;
      var stocks = (g.stocks || []).length
        ? '<div class="sub-stocks">' + g.stocks.map(function (st) {
          return '<button class="sub-stock" data-act="openSymbol" data-symbol="' + U.esc(st.symbol) + '">' +
            U.esc(st.name) +
            '<b>' + U.pct(st.weight, 1) + '</b></button>';
        }).join('') + '</div>'
        : '';
      return '<div style="margin-bottom:12px">' +
        '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px">' +
        '<span style="font-weight:600">' + U.esc(g.label || '—') + '</span>' +
        '<span class="muted">' + U.pct(pct, 1) + ' · ¥' + U.moneyCompact(g.marketValue) + ' · ' + g.count + ' 只</span></div>' +
        '<div class="bar"><i style="width:' + Math.max(0, pct).toFixed(1) + '%"></i></div>' +
        stocks +
        '</div>';
    }).join('') : '<div class="tiny" style="text-align:center;padding:10px 0">暂无数据</div>') + '</div>';

    html += '</div>';                          // 收第 1 列
    html += '<div class="an-col">';            // 第 2 列：集中度
    /* ⑧ 集中度（具体列出每只股票的占比与累计占比） */
    var cc = an.concentration;
    html += '<div class="section-title">集中度</div>';
    html += '<div class="card">' +
      '<div class="card-head" style="margin-bottom:8px"><h2 style="font-size:14px">' + U.esc(cc.level) + '</h2>' +
      '<div class="spacer"></div><span class="hint">HHI ' + (cc.hhi === null ? '—' : cc.hhi.toFixed(3)) + '</span></div>' +
      '<div class="kv"><span class="k">第一大持仓占比</span><span class="v">' + U.pct(cc.top1, 1) + '</span></div>' +
      '<div class="kv"><span class="k">前三大占比</span><span class="v">' + U.pct(cc.top3, 1) + '</span></div>' +
      '<div class="kv"><span class="k">前五大占比</span><span class="v">' + U.pct(cc.top5, 1) + '</span></div>';

    /* 逐只明细 */
    var cl = cc.holdings || [];
    if (cl.length) {
      var maxW = Math.max.apply(null, cl.map(function (x) { return x.weight; }).concat([1]));
      html += '<div class="sub-divider">逐只占比</div>';
      html += cl.map(function (x) {
        var isTop3 = x.rank <= 3;
        return '<button class="conc-row" data-act="openSymbol" data-symbol="' + U.esc(x.symbol) + '">' +
          '<span class="conc-rank' + (isTop3 ? ' top' : '') + '">' + x.rank + '</span>' +
          '<span class="conc-name">' + U.esc(x.name) + '</span>' +
          '<span class="conc-val">' + U.pct(x.weight, 1) + '</span>' +
          '<span class="conc-cum" title="累计占比">Σ ' + U.pct(x.cumWeight, 1) + '</span>' +
          '<span class="conc-bar"><i style="width:' + (x.weight / maxW * 100).toFixed(1) + '%"></i></span>' +
          '</button>';
      }).join('');
      if (cl.length > 3) {
        html += '<div class="tiny" style="margin-top:8px">前三大：' +
          U.esc(cl.slice(0, 3).map(function (x) { return x.name; }).join(' / ')) + '</div>';
      }
    }

    html += '</div>';                          // 收第 2 列
    html += '</div>';                          // 收第 2 组 .an-split
    html += '<div class="note-line" style="margin-top:10px">' + UI.icon('info', 13) +
      '<span>HHI（赫芬达尔指数）越大越集中：&lt;0.15 相对分散，0.15–0.25 较为集中，&gt;0.25 高度集中。' +
      'Σ 为累计占比，集中度高意味着单只标的大幅波动会显著影响账户整体。</span></div>' +
      '</div>';

    return html;
  }

  return { render: render };
})();

/* ==================== 视图：个股详情（独立页） ==================== */
XJ.views.symbol = (function () {
  var U = XJ.util, UI = XJ.ui, C = XJ.views.common;

  /**
   * 技术信号（BOLL 下轨 + KDJ 的 J<0）。
   * 与持仓卡片保持同一口径：中性文案、周线优先、结果不缓存、每次 render 现算。
   * 这里单独实现一份（而非从 views.common 导出），是因为两处取 price 的方式不同：
   * 卡片用 h.price，详情页在无持仓时会退回 quoteCache 的价格。
   */
  function signalOf(symbol, price) {
    var cache = XJ.store.state.klineCache && XJ.store.state.klineCache[symbol];
    if (!cache || !cache.day || cache.day.length < 2) return null;
    var sig = XJ.calc.bollSignal(symbol, cache.day, cache.week || [], price, U.today());
    return sig ? { text: sig.text, cls: sig.cls } : null;
  }

  /* ---------------- 股息率曲线（财年口径） ----------------
   * 口径见 calc.yieldFiscalSteps / calc.dividendYieldSeries 的注释。
   *
   * 时间轴：默认最近十年，**一律交易日（日线）粒度**。
   * 腾讯单次 count 上限 2000 根（只够 8.2 年），所以取数分两个窗口拼接
   * （见 fetcher.fetchYieldHistory），而不是退回周线 —— 退周线会让相邻点差好几天。
   */
  var YJ_COLOR = '#E8461F';        // 股息率（与分红金额同色）
  var YJ_BENCH_COLOR = '#E9A93C';  // 余额宝七日年化
  var YJ_MARK_COLOR = '#F08A24';   // 除权除息日散点
  var YJ_AVG_COLOR = '#4A7BB0';    // 历史平均股息率（分财年，虚线）—— 中性冷色，不与涨红跌绿抢语义
  var YJ_TEN_YEARS = 3653;         // ≈10 年

  function yjBenchOn(st) {
    return !!(st.state.settings && st.state.settings.showYieldBench === true);
  }

  function sliceByDate(list, beg, end) {
    return (list || []).filter(function (p) { return p.date >= beg && p.date <= end; });
  }

  /**
   * 生成股息率卡片。
   * @param symbol 内部代码
   * @param plans  该标的的全部 DividendPlan
   * @param st     XJ.store
   * @param h      持仓行（可能为 undefined，无持仓也照常出图）
   */
  function yieldCard(symbol, plans, st, h) {
    var open = '<div class="card yj-card" style="margin-bottom:12px">';
    var head = function (hint, extra) {
      return '<div class="card-head" style="margin-bottom:10px">' +
        '<h2>股息率</h2>' +
        C.qmark('股息率 = 该财年派现总额 ÷ 当时总市值 × 100%。' +
          '数学上等价于「每股派现 ÷ 当时股价」（总股本约掉）。' +
          '分子的生效时点取该财年年报的预案公告日；含已公告的预案。') +
        '<span class="hint">' + U.esc(hint) + '</span>' +
        '<div class="spacer"></div>' + (extra || '') + '</div>';
    };

    /* ① 不支持的市场：美股无分红源、场外基金没有「财年派现」概念 */
    if (!XJ.market.supportsYieldCurve(symbol)) {
      var why = XJ.market.assetType(symbol) === 'of'
        ? '场外基金的分红不定期、没有「财年派现」这个概念'
        : XJ.market.kind(symbol) + '暂无公开可用的免费分红数据源';
      return open + head('不适用') +
        '<div class="tiny" style="line-height:1.7">因' + U.esc(why) +
        '，无法按财年口径绘制股息率曲线。</div></div>';
    }

    var steps = XJ.calc.yieldFiscalSteps(plans || []);
    var cache = (st.state.yieldHistory && st.state.yieldHistory[symbol]) || null;
    var closes = (cache && cache.day) || [];

    /* ② 没有可用的财年方案 */
    if (!steps.length) {
      return open + head('—') +
        '<div class="tiny" style="line-height:1.7">还没有可用的年报分红数据。' +
        '点下方「同步该标的数据」获取分红方案后即可绘制。</div></div>';
    }

    /* ③ 有方案但收盘价缓存还没到位 */
    if (closes.length < 2) {
      return open + head('—',
        '<button class="ghost-btn" data-act="refreshOne" data-symbol="' + U.esc(symbol) + '">刷新</button>') +
        '<div class="tiny" style="line-height:1.7">' +
        (st.ui.busy ? '正在获取历史收盘价…' : '还没有历史收盘价。点右上「刷新」拉取后即可绘制曲线。') +
        '</div></div>';
    }

    /* ---- 序列（只保留算得出股息率的点） ---- */
    var all = XJ.calc.dividendYieldSeries(plans, closes);
    if (all.length < 2) {
      /* 价格有了，但没有任何一天落在财年生效日之后（例如刚上市的新股） */
      return open + head('—') +
        '<div class="tiny" style="line-height:1.7">历史收盘价与已公告的分红方案没有重叠区间，暂时画不出曲线。</div></div>';
    }

    /* ---- 平均股息率线（分财年） ----
       口径由 ui.yieldAvgMode 决定，且**只吃 2022-01-01 起的样本**（calc 内部固定）。
       刻意不用时间轴选区去切样本：均值是「该财年」的属性，不该随缩放而变。 */
    var avgMode = st.ui.yieldAvgMode === 'cum' ? 'cum' : 'year';
    var avgGroups = XJ.calc.yieldYearAverages(plans, closes);
    var avgAll = XJ.calc.yieldAverageSeries(plans, closes, avgMode);

    /* 默认最近十年：右端取序列最后一天，左端取「最后一天 − 10 年」但不早于序列起点 */
    var endD = all[all.length - 1].date;
    var begLimit = all[0].date;
    var begD = U.addDays(endD, -YJ_TEN_YEARS);
    if (!begD || begD < begLimit) begD = begLimit;
    /* 若用户上次拖过时间轴，恢复他选的范围（静默写在 ui 里，见 onChange） */
    if (st.ui.yjBeg && st.ui.yjEnd && st.ui.yjEnd >= begLimit && st.ui.yjBeg <= endD && st.ui.yjBeg < st.ui.yjEnd) {
      begD = st.ui.yjBeg < begLimit ? begLimit : st.ui.yjBeg;
      endD = st.ui.yjEnd > endD ? endD : st.ui.yjEnd;
    }

    var marks = XJ.calc.exDividendDates(plans || []);
    var benchPts = (st.state.benchHistory && st.state.benchHistory.points) || [];
    var showBench = yjBenchOn(st);

    function buildMain(beg, end) {
      var pts = sliceByDate(all, beg, end);
      if (pts.length < 2) {
        return { html: '<div class="tiny" style="padding:18px 0;text-align:center">该区间内数据不足。</div>' };
      }
      var seriesList = [{
        key: 'yj', name: '股息率', color: YJ_COLOR,
        points: pts.map(function (p) { return { date: p.date, pct: p.y }; }),
      }];
      /* 平均股息率线：与主曲线同一批日期（同一个 dividendYieldSeries 派生），按区间直接切片。
         样本门槛只会落在首尾两个财年段 —— 中间的财年都有约 240 个交易日，不可能不足 120 天 ——
         所以被跳过的那段永远在序列两端，折线不会跨过它连出一条假的斜线。 */
      var av = sliceByDate(avgAll, beg, end);
      if (av.length >= 2) {
        seriesList.push({
          key: 'avg', name: '历史平均股息率', color: YJ_AVG_COLOR, dash: '6 4', width: 1.5,
          points: av.map(function (p) { return { date: p.date, pct: p.y }; }),
        });
      }
      if (showBench && benchPts.length) {
        var bp = sliceByDate(benchPts.map(function (p) { return { date: p[0], y: p[1] }; }), beg, end);
        if (bp.length >= 2) {
          seriesList.push({
            key: 'bench', name: '余额宝七日年化', color: YJ_BENCH_COLOR,
            points: bp.map(function (p) { return { date: p.date, pct: p.y }; }),
          });
        }
      }
      var svg = XJ.chart.renderCompare(seriesList, {
        chartKey: 'yield', unit: 'yield', fmtY: U.pctAxis, xTicks: 4,
        markers: marks, markerColor: YJ_MARK_COLOR,
      });
      return { html: svg || '<div class="tiny" style="padding:18px 0;text-align:center">该区间内数据不足。</div>' };
    }

    var built = buildMain(begD, endD);

    /* brush 的概览序列：与主图同一批数据，这样拖动时左右边界一眼能对上 */
    var overview = all;

    function idxOfDate(list, d) {
      var best = 0, bestGap = Infinity;
      for (var i = 0; i < list.length; i++) {
        var g = Math.abs(U.daysBetween(list[i].date, d) || 0);
        if (g < bestGap) { bestGap = g; best = i; }
      }
      return best;
    }

    /* 拖动时间轴：**不碰 store**，直接重画主图容器的 innerHTML。
       brush 是独立的第二个 SVG，所以重画主图不会销毁抓手、手势不会断。 */
    function onChange(b, e, isFinal) {
      if (!(b && e) || b >= e) return;
      var box = document.querySelector('.yj-chart[data-yj-chart="1"]');
      if (box) box.innerHTML = buildMain(b, e).html;
      /* 每次变化都**静默**记进 ui（不走 setUI，否则整页重建 + 滚动跳动）。
         拖动中记是为了「万一中途被后台重渲染打断」时能接着拖（chart.js 会据此把选区找回来）；
         松手后记是为了让后续任何整页重渲染都能恢复用户选定的范围。 */
      st.ui.yjBeg = b;
      st.ui.yjEnd = e;
      void isFinal;
    }

    var brushHtml = XJ.chart.brush(overview, {
      chartKey: 'yield',
      begIdx: idxOfDate(overview, begD),
      endIdx: idxOfDate(overview, endD),
      color: '#A8C4E8',
      onChange: onChange,
    });

    /* ---- 图例 ----
       余额宝那条是「开 / 关」；平均股息率那条**不是开关**（均线常亮、不可关闭），
       点它是换口径 —— 所以刻意不给它 off 态，否则会被读成「这条线已关闭」。 */
    var benchOn = showBench && benchPts.length >= 2;
    var avgCum = avgMode === 'cum';
    var legend = '<div class="yj-legend">' +
      '<span class="on"><i class="ln" style="background:' + YJ_COLOR + '"></i>股息率</span>' +
      '<button class="yj-leg-btn" data-act="switchYieldAvg"' +
      ' title="点击切换口径：该财年整年均值 ⇄ 自切换日起逐日累积">' +
      '<i class="ln dash" style="--lnc:' + YJ_AVG_COLOR + '"></i>历史平均股息率 · ' +
      (avgCum ? '自切换日起累积' : '整年均值') + '</button>' +
      '<button class="yj-leg-btn' + (benchOn ? ' on' : ' off') + '" data-act="toggleYieldBench">' +
      '<i class="ln" style="background:' + (benchOn ? YJ_BENCH_COLOR : 'var(--text-3)') + '"></i>余额宝七日年化收益率</button>' +
      '<span class="on"><i class="sq" style="background:' + YJ_MARK_COLOR + '"></i>除权除息日</span>' +
      '</div>';

    /* ---- 当前读数 vs 均线：只给「高于 / 低于」，不给任何建议性措辞 ---- */
    var viewPts = sliceByDate(all, begD, endD);
    var lastPt = viewPts.length ? viewPts[viewPts.length - 1] : null;
    var avgStat = '';
    if (lastPt) {
      var avgRef = null;
      for (var ai = avgAll.length - 1; ai >= 0; ai--) {
        if (avgAll[ai].date <= lastPt.date) { avgRef = avgAll[ai]; break; }
      }
      if (avgRef && avgRef.year === lastPt.year) {
        avgStat = '当前 ' + lastPt.y.toFixed(2) + '% · FY' + lastPt.year +
          (avgCum ? ' 累积均值 ' : ' 均值 ') + avgRef.y.toFixed(3) + '% → ' +
          (lastPt.y >= avgRef.y ? '高于均值' : '低于均值');
      } else {
        var gg = null;
        for (var yi = 0; yi < avgGroups.length; yi++) {
          if (avgGroups[yi].year === lastPt.year) gg = avgGroups[yi];
        }
        if (gg) {
          avgStat = 'FY' + gg.year + ' 生效 ' + gg.days + ' 个交易日，不足 ' +
            XJ.calc.YIELD_AVG_MIN_DAYS + ' 天，暂不绘制该财年平均线。';
        }
      }
    }
    var avgStatHtml = avgStat ? '<div class="tiny yj-avg-stat">' + avgStat + '</div>' : '';

    var benchTip = '';
    if (benchOn) benchTip = '余额宝七日年化为周频（该数据本身极平滑，画日频只是徒增体积）。';
    else if (showBench) benchTip = '正在获取余额宝七日年化数据…';

    return open + head('最近十年 · 日线',
      '<button class="ghost-btn" data-act="refreshOne" data-symbol="' + U.esc(symbol) + '">刷新</button>') +
      legend + avgStatHtml +
      '<div class="yj-chart" data-yj-chart="1">' + built.html + '</div>' +
      (brushHtml ? '<div class="yj-brush">' + brushHtml + '</div>' : '') +
      '<div class="tiny yj-note" style="line-height:1.7">' +
      '注：股息率 = 该财年派现总额 ÷ 当时总市值（等价于每股派现 ÷ 当时股价）；' +
      '分子含已公告的预案，以最终实施方案为准。' +
      (benchTip ? '<br>' + U.esc(benchTip) : '') +
      '<br>曲线上的橙色方块是除权除息日；拖动下方时间轴可缩放时间尺度。' +
      '<br>平均股息率按财年分段计算：一个财年窗口内分子是常数，所以均线的高低只反映价格，' +
      '与「当年分红比历史平均多还是少」无关。' +
      (avgCum
        ? '当前口径「自切换日起累积」：只用生效日到当天的样本，没有前视偏差；代价是财年开头样本少、均线会较陡。'
        : '当前口径「整年均值」：用该财年整段窗口的样本，线条平稳；代价是年内用到了后面才发生的价格，回看历史信号有前视偏差。') +
      '<br>分子换档（年报预案公告日）会让均线跳一格，切换日附近读数仅供参考；' +
      '新财年样本不足 ' + XJ.calc.YIELD_AVG_MIN_DAYS + ' 个交易日时，该财年段不绘制。' +
      '</div></div>';
  }

  function render() {
    var st = XJ.store;
    var symbol = st.ui.subArg;
    if (!symbol) {
      return UI.emptyState('🔍', '未指定标的', '请从持仓列表进入。',
        '<button class="ghost-btn primary" data-act="closeSubPage">返回</button>');
    }

    var acc = st.acc();
    var h = XJ.calc.holdings(st.state, acc).filter(function (x) { return x.symbol === symbol; })[0];
    var plans = XJ.calc.plansOf(st.state, symbol);
    var txs = XJ.calc.txOf(st.state, acc, symbol).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var recs = st.state.received.filter(function (r) {
      return r.symbol === symbol && (acc === XJ.calc.ALL || r.accountId === acc);
    }).sort(function (a, b) { return a.exDividendDate < b.exDividendDate ? 1 : -1; });

    var name = st.symbolName(symbol);
    var quote = st.state.quoteCache[symbol];
    var price = h ? h.price : (quote ? U.num(quote.price) : null);
    var html = '';

    /* 技术信号（中性文案「日线下轨 / 周线下轨」，周线优先）。
       与持仓卡片共用同一套纯函数与口径，结果每次 render 现算、不缓存。 */
    var sigObj = signalOf(symbol, price);
    var sig = sigObj ? '<span class="hc-sig ' + sigObj.cls + '">' + U.esc(sigObj.text) + '</span>' : '';

    /* 无分红数据源的市场（如美股）如实提示，并给出手工补录的出口 */
    if (!XJ.market.supportsDividend(symbol)) {
      html += '<div class="warn-card"><span class="ic">ⓘ</span><span>' +
        '<b>' + U.esc(XJ.market.kind(symbol)) + '暂无公开可用的免费分红数据源</b>，无法自动同步分红方案与派息日。<br>' +
        '可在下方「分红记录」中手工补录历史分红，系统会照常计算股价息率与分红回本进度。</span></div>';
    }

    /* ① 预测年分红 */
    if (h) {
      html += '<div class="card" style="background:var(--slogan-grad);border:1px solid var(--warn-line);margin-bottom:12px">' +
        '<div style="display:flex;align-items:flex-start">' +
        '<div style="flex:1;min-width:0">' +
        '<div class="muted" style="font-size:12px">预测年分红</div>' +
        '<div style="font-size:32px;font-weight:750;letter-spacing:-1.2px;color:var(--dividend);margin-top:3px">' +
        U.moneySign(h.predictedDividendCny) + '</div>' +
        '<div class="tiny" style="margin-top:6px">每股 ' + U.money(h.annualPerShare, 4) + ' × ' + U.thousands(h.qty) + '股</div>' +
        '<div class="tiny" style="margin-top:2px">' + U.esc(C.planBasisLabel(h)) + '</div>' +
        '</div>' +
        '<button class="ghost-btn" data-act="openBasisEditor" data-symbol="' + U.esc(symbol) + '">觉得不准？</button>' +
        '</div>' +
        '</div>';
    }

    /* ② 当前市值 */
    html += '<div class="card" style="margin-bottom:12px">' +
      '<div style="display:flex;align-items:center;gap:12px">' +
      UI.avatar(name, symbol, 44, C.logoOf(h)) +
      '<div style="flex:1;min-width:0">' +
      '<div class="row-t"><span class="nm">' + U.esc(name) + '</span>' +
      (h && h.changePct !== null && h.changePct !== undefined
        ? '<span class="chg ' + (U.direction(h.changePct) === 'flat' ? 'flat' : U.direction(h.changePct)) + '">' + U.signPct(h.changePct) + '</span>' : '') +
      '</div>' +
      '<div class="row-s">' + U.esc(XJ.market.displayCode(symbol)) + sig + '</div>' +
      '</div>' +
      '<div style="text-align:right">' +
      '<div class="row-v ' + U.dirClass(h ? h.changePct : null) + '">' +
      (price === null ? '—' : U.money(price, price >= 100 ? 2 : 3)) + '</div>' +
      '<div class="row-v2">' + U.esc(XJ.market.currency(symbol)) + '</div>' +
      '</div></div>';

    if (h) {
      html += '<div class="hc-grid">' +
        '<div class="hc-cell"><div class="k">当前市值</div><div class="v">' + U.moneySign(h.marketValueCny) + '</div></div>' +
        '<div class="hc-cell"><div class="k">收盘价 × 股数</div><div class="v">' +
        (price === null ? '—' : U.money(price) + ' × ' + U.thousands(h.qty)) + '</div></div>' +
        '</div>';
    } else {
      html += '<div class="tiny" style="margin-top:10px">当前账户下没有该标的的持仓。</div>';
    }
    html += '</div>';

    /* ★ 股息率曲线（财年口径）—— 紧跟当前市值，位置最醒目。
       无持仓也照常渲染：这是标的的基本面属性，与是否持有无关。 */
    html += yieldCard(symbol, plans, st, h);

    if (h) {
      /* ③④⑤ 双息率 */
      html += '<div class="hc-grid" style="margin:0 0 12px;padding:0">' +
        '<div class="card" style="margin:0;padding:12px 14px">' +
        '<div class="tiny">成本息率' + C.qmark('每股年分红 ÷ 持仓成本 = ' + U.money(h.annualPerShare, 4) + ' ÷ ' + U.money(h.avgCost, 4)) + '</div>' +
        '<div style="font-size:22px;font-weight:730;color:var(--dividend);margin-top:3px">' +
        (h.costYield === null ? '已回本' : U.pct(h.costYield)) + '</div>' +
        '<div class="tiny">成本 ' + U.money(h.avgCost, 4) + '</div></div>' +
        '<div class="card" style="margin:0;padding:12px 14px">' +
        '<div class="tiny">股价息率' + C.qmark('每股年分红 ÷ 最新收盘价') + '</div>' +
        '<div style="font-size:22px;font-weight:730;color:var(--dividend);margin-top:3px">' +
        (h.dividendYield === null ? '—' : U.pct(h.dividendYield)) + '</div>' +
        '<div class="tiny">基于收盘价 ' + (price === null ? '—' : U.money(price)) + '</div></div>' +
        '</div>';

      /* ⑥⑦ 持仓明细：数量与成本可直接改（改的是流水，见下方说明） */
      html += '<div class="card" style="margin-bottom:12px">' +
        '<div class="card-head"><h2>持仓明细</h2><div class="spacer"></div>' +
        '<span class="hint">点带笔的数值可修改</span></div>' +
        '<button class="kv-edit" data-act="editQty" data-symbol="' + U.esc(symbol) + '">' +
        '<span class="k">持仓数量</span>' +
        '<span class="v">' + U.thousands(h.qty) + ' 股<span class="pen">' + UI.icon('edit', 13, 1.9) + '</span></span></button>' +
        '<button class="kv-edit" data-act="editCost" data-symbol="' + U.esc(symbol) + '">' +
        '<span class="k">当前成本' + C.qmark('成本口径：' + C.costMethodLabel(h.costMethod)) + '</span>' +
        '<span class="v">' + U.money(h.avgCost, 4) +
        ' <span class="pill div">' + C.costMethodLabel(h.costMethod) + '</span>' +
        '<span class="pen">' + UI.icon('edit', 13, 1.9) + '</span></span></button>' +
        '<div class="kv"><span class="k">已实现盈亏' + C.qmark('由卖出价格与卖出时点的加权成本共同决定，所以不可直接编辑') + '</span>' +
        '<span class="v ' + (h.costMethod === 'weighted' ? U.dirClass(h.realizedCny) : 'muted') + '">' +
        (h.costMethod === 'weighted' ? U.signMoney(h.realizedCny) : '摊薄口径下不适用') + '</span></div>' +
        '<div class="kv"><span class="k">持股天数' + C.qmark('自首笔买入日起算') + '</span>' +
        '<span class="v">' + h.holdDays + ' 天' + (h.holdSince ? '（' + U.esc(h.holdSince) + ' 起）' : '') + '</span></div>' +
        '<div class="kv"><span class="k">累计已获分红</span><span class="v c-div">' + U.moneySign(h.receivedTotalCny) + '</span></div>' +
        (h.costMethod === 'dividendDiluted'
          ? (h.receivedTotalCny > 0
            ? '<div class="note-line" style="margin-top:8px">' + UI.icon('check', 13) +
              /* 这一句讲的是「每股成本被摊薄了多少」，而每股成本是**原币**（港股就是港元），
                 所以金额也用原币并标出币种符号，否则 ¥ 总额配 HK$ 每股会自相矛盾。 */
              '<span>已用累计分红 <b class="c-div">' + U.esc(h.curSymbol) + U.money(h.receivedTotal, 0) +
              '</b> 摊薄成本（每股摊薄 ' + U.esc(h.curSymbol) + U.money(h.receivedTotal / (h.qty || 1), 4) +
              '）—— 分红到账后成本自动下降，无需手工改。</span></div>'
            : '<div class="note-line" style="margin-top:8px">' + UI.icon('info', 13) +
              '<span>当前口径是「分红摊薄」，但该标的还没有已到账的分红记录，所以成本尚未下降；' +
              '分红到账后会自动摊薄（A股按除权除息日、基金与港股按数据源给出的派息日）。</span></div>')
          : '') +
        '<div class="note-line" style="margin-top:8px">' + UI.icon('info', 13) +
        '<span>持仓由交易流水推导，因此改动会落成一笔记录：改数量补一笔买入/卖出，改成本补一笔「成本调整」，都可以在下方交易明细里删除。</span></div>' +
        '</div>';

    /* ⑧ 交易明细（可伸缩；点击任意一行可编辑）

    var yRate = XJ.calc.cnyRateOf(st.state, symbol);
    var divRows = recs.map(function (r) {

               qty: U.n0(r.qtyAtRecord), source: r.source };
    });
    var txFolded = st.ui.foldTx !== false;      // 默认收起

      '</div>';
    if (!txs.length && !divRows.length) {
      html += '<div style="padding:0 16px 16px" class="tiny">暂无交易记录。</div>';
    } else if (txFolded) {
      html += '<div class="fold-hint">已收起，共 ' + txs.length + ' 笔' +
        (divRows.length ? ' 交易 + ' + divRows.length + ' 笔分红摊薄' : '') + ' · 点标题展开查看</div>';
    } else {
      html += '<div class="table-wrap"><table class="tbl"><thead><tr>' +
        '<th>日期</th><th>方向</th><th>数量</th><th>价格</th><th>金额</th><th></th></tr></thead><tbody>';
      var combined = txs.map(function (t) { return { kind: 'tx', t: t, date: t.date }; })
        .concat(divRows)
        .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
      combined.forEach(function (row) {
        if (row.kind === 'div') {
          html += '<tr class="tx-row tx-div" title="分红到账自动摊薄成本（只读；手工补录的分红可在下方「分红记录」里删除）">' +
            '<td>' + U.esc(row.date) + '</td>' +

        var dirPill = isAdj

            (t.action === 'BUY' ? (U.n0(t.price) === 0 ? '送股' : '买入') : '卖出') + '</span>';
        html += '<tr class="tx-row" data-act="editTx" data-id="' + U.esc(t.txId) + '" title="点击编辑这笔记录">' +

      /* ⑨ 分红回本进度 */

        '<div class="card-head" style="margin-bottom:10px"><h2>分红回本进度</h2><div class="spacer"></div>' +

        '<div class="recover-grid">' +
        '<div class="rc"><div class="k">净投入</div><div class="v">' + U.moneySign(h.netInvestedCny, 0) + '</div></div>' +

        '</div>';
    }

    /* ⑩ 分红档案（可折叠） */
    html += '<div class="card flush" style="margin-bottom:12px">';
    var planFolded = st.ui.foldPlans !== false;      // 默认收起（条数多时很长）
